    const newDeleted = [...recentlyDeleted, { ...task, deletedAt: Date.now() }];
    setRecentlyDeleted(newDeleted);
    saveTasks(tasks.filter(t => t.id !== id));
    // Auto-dismiss after 8 seconds
    if (undoTimeoutRef.current) clearTimeout(undoTimeoutRef.current);
    undoTimeoutRef.current = setTimeout(() => {
      setRecentlyDeleted(prev => prev.filter(d => Date.now() - d.deletedAt < 8000));
    }, 8500);
  };
  const undoDelete = (id) => {
    const item = recentlyDeleted.find(d => d.id === id);
    if (!item) return;
    const { deletedAt, ...task } = item;
    setRecentlyDeleted(prev => prev.filter(d => d.id !== id));
    saveTasks([task, ...tasks]);
  };
  const dismissUndo = (id) => {
    setRecentlyDeleted(prev => prev.filter(d => d.id !== id));
  };
  const changeStatus = (id, s) => saveTasks(tasks.map(t => t.id === id ? { ...t, status: s } : t));
  const updatePaper = (id, updates) => saveTasks(tasks.map(t => t.id === id ? { ...t, ...updates } : t));
  const changeMonth = (dir) => { const d = new Date(calDate); d.setMonth(d.getMonth() + dir); setCalDate(d); setSelectedDate(null); };

  // Trip handlers
  const saveTrips = useCallback(async (nt) => { setTrips(nt); try { await window.storage.set(TRIPS_KEY, JSON.stringify(nt)); } catch (e) {} }, []);
  const addTrip = (t) => saveTrips([...trips, t]);
  const handleEditTrip = (trip) => { setEditTrip(trip); setShowTripForm(true); };
  const saveEditTrip = (updated) => saveTrips(trips.map(t => t.id === updated.id ? updated : t));
  const deleteTrip = (id) => saveTrips(trips.filter(t => t.id !== id));

  // Habit handlers
  const saveHabits = useCallback(async (nh) => { setHabits(nh); try { await window.storage.set(HABITS_KEY, JSON.stringify(nh)); } catch (e) {} }, []);
  const saveHabitLog = useCallback(async (nl) => { setHabitLog(nl); try { await window.storage.set(HABIT_LOG_KEY, JSON.stringify(nl)); } catch (e) {} }, []);
  const addHabit = (h) => saveHabits([...habits, h]);
  const handleEditHabit = (h) => { setEditHabit(h); setShowHabitForm(true); };
  const saveEditHabit = (updated) => saveHabits(habits.map(h => h.id === updated.id ? updated : h));
  const deleteHabit = (id) => { saveHabits(habits.filter(h => h.id !== id)); const newLog = { ...habitLog }; Object.keys(newLog).forEach(k => { if (k.startsWith(id + ":")) delete newLog[k]; }); saveHabitLog(newLog); };
  const toggleHabit = (habitId, dateStr) => { const key = habitId + ":" + dateStr; const newLog = { ...habitLog }; if (newLog[key]) delete newLog[key]; else newLog[key] = true; saveHabitLog(newLog); };

  // Schedule handlers
  const saveSchedule = useCallback(async (ns) => { setSchedule(ns); try { await window.storage.set(SCHEDULE_KEY, JSON.stringify(ns)); } catch (e) {} }, []);
  const saveReadings = useCallback(async (nr) => { setReadings(nr); try { await window.storage.set(READING_KEY, JSON.stringify(nr)); } catch (e) {} }, []);
  const saveReadingTags = useCallback(async (nt) => { setReadingTags(nt); try { await window.storage.set(READING_TAGS_KEY, JSON.stringify(nt)); } catch (e) {} }, []);
  const assignToDate = (date, taskId, sectionId) => {
    const ns = { ...schedule };
    if (!ns[date]) ns[date] = [];
    if (!ns[date].some(a => a.taskId === taskId && (a.sectionId || null) === (sectionId || null))) {
      ns[date] = [...ns[date], { taskId, sectionId: sectionId || null }];
    }
    saveSchedule(ns);
  };
  const unassignFromDate = (date, taskId, sectionId) => {
    const ns = { ...schedule };
    if (!ns[date]) return;
    ns[date] = ns[date].filter(a => !(a.taskId === taskId && (a.sectionId || null) === (sectionId || null)));
    if (ns[date].length === 0) delete ns[date];
    saveSchedule(ns);
  };
  const handleDateClick = (dateStr) => {
    if (selectedDate === dateStr) { setSelectedDate(null); }
    else { setSelectedDate(dateStr); }
  };
  const handleDateLongOrDouble = (dateStr) => { setAssignDate(dateStr); };

  const closedStatuses = new Set(["noreply", "success", "reviewed", "notapplied", "nointerview", "accepted", "rejected"]);
  const filtered = tasks.filter(t => {
    if (filterCat !== "all" && t.category !== filterCat) return false;
    if (filterStatus === "active" && closedStatuses.has(t.status)) return false;
    if (filterStatus === "closed" && !closedStatuses.has(t.status)) return false;
    if (selectedDate) {
      const dates = [t.deadline, t.interviewDate, t.notificationDate, t.conferenceDate];
      const scheduledIds = (schedule[selectedDate] || []).map(a => a.taskId);
      if (!dates.includes(selectedDate) && !scheduledIds.includes(t.id)) return false;
    }
    return true;
  });
  const todayStr = localDateStr(new Date());
  const todayScheduledIds = new Set((schedule[todayStr] || []).map(a => a.taskId));
  const sorted = [...filtered].sort((a, b) => {
    // Today's assigned first
    const aToday = todayScheduledIds.has(a.id) ? 0 : 1;
    const bToday = todayScheduledIds.has(b.id) ? 0 : 1;
    if (aToday !== bToday) return aToday - bToday;
    // Then active before closed
    const aClosed = closedStatuses.has(a.status) ? 1 : 0;
    const bClosed = closedStatuses.has(b.status) ? 1 : 0;
    if (aClosed !== bClosed) return aClosed - bClosed;
    // Then has-deadline before no-deadline
    const aHas = a.deadline ? 0 : 1;
    const bHas = b.deadline ? 0 : 1;
    if (aHas !== bHas) return aHas - bHas;
    if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
    return 0;
  });
  const activeTasks = tasks.filter(t => !closedStatuses.has(t.status));
  const urgentCount = activeTasks.filter(t => { const d = daysBetween(t.deadline); return d !== null && d >= 0 && d <= 3; }).length;

  const exportAllICS = () => {
    const withDeadlines = tasks.filter(tk => tk.deadline && !closedStatuses.has(tk.status));
    if (withDeadlines.length === 0) return;
    const now = new Date();
    const stamp = now.getFullYear().toString() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0") + "T" + String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0");
    const esc = (s) => (s || "").replace(/[\\;,\n]/g, (m) => m === "\n" ? "\\n" : "\\" + m);
    const events = withDeadlines.map(task => {
      const cat = CATEGORIES.find(c => c.id === task.category);
      const catLabel = cat ? cat.label : "Task";
      const d = task.deadline.replace(/-/g, "");
      let dtStart, dtEnd;
      if (task.deadlineTime) {
        const tp = task.deadlineTime.replace(/[^0-9:]/g, "").split(":");
        const hh = (tp[0] || "00").padStart(2, "0"); const mm = (tp[1] || "00").padStart(2, "0");
        dtStart = d + "T" + hh + mm + "00";
        dtEnd = d + "T" + String(Math.min(23, parseInt(hh) + 1)).padStart(2, "0") + mm + "00";
      } else {
        const next = new Date(task.deadline + "T00:00:00"); next.setDate(next.getDate() + 1);
        dtStart = d; dtEnd = localDateStr(next).replace(/-/g, "");
      }
      const isAllDay = !task.deadlineTime;
      return ["BEGIN:VEVENT", "UID:" + task.id + "@academic-tracker", "DTSTAMP:" + stamp,
        isAllDay ? "DTSTART;VALUE=DATE:" + dtStart : "DTSTART:" + dtStart,
        isAllDay ? "DTEND;VALUE=DATE:" + dtEnd : "DTEND:" + dtEnd,
        "SUMMARY:" + esc("[" + catLabel + "] " + task.title),
        "DESCRIPTION:" + esc((task.notes || "") + (task.url ? "\\n" + task.url : "")),
        "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", "DESCRIPTION:Due tomorrow: " + esc(task.title), "END:VALARM",
        "END:VEVENT"].join("\r\n");
    });
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//AcademicTracker//EN", ...events, "END:VCALENDAR"].join("\r\n");
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "academic_deadlines.ics";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (!loaded) return <div style={{ fontFamily: "'Inter',system-ui,sans-serif", padding: 40, textAlign: "center", color: t.textTer, background: t.bgPage, minHeight: "100vh" }}>Loading...</div>;

  return (
    <ThemeCtx.Provider value={t}>
    <div style={{ fontFamily: "'Inter',system-ui,sans-serif", maxWidth: 860, margin: "0 auto", padding: "20px 16px 40px", color: t.text, background: t.bgPage, minHeight: "100vh" }}>
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, justifyContent: "space-between" }}>
          <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px", letterSpacing: "-0.02em" }}>Academic Tracker</h1>
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            <button onClick={syncToSheet} disabled={syncing} title="Push data to Google Sheet" style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 8px", fontSize: 12, color: "#5B7FD1", fontWeight: 600, cursor: syncing ? "wait" : "pointer", display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 13 }}>{"\u25B2"}</span> Push
            </button>
            <button onClick={pullFromSheet} disabled={syncing} title="Pull data from Google Sheet" style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 8px", fontSize: 12, color: "#D4883A", fontWeight: 600, cursor: syncing ? "wait" : "pointer", display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 13 }}>{"\u25BC"}</span> Pull
            </button>
            <a href={SHEET_URL} target="_blank" rel="noopener noreferrer" title="Open Google Sheet" style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 8px", fontSize: 12, color: "#2A7A3A", fontWeight: 600, textDecoration: "none", display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 14 }}>📊</span> Sheet
            </a>
            <button onClick={exportAllICS} title="Export all deadlines to Apple Calendar" style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 8px", fontSize: 12, color: "#8B5CF6", fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 14 }}>📅</span> .ics
            </button>
          </div>
        </div>
        {syncMsg && <div style={{ fontSize: 11, color: syncMsg.includes("✓") ? "#2A7A3A" : syncMsg.includes("...") ? t.textTer : "#B04040", fontWeight: 600, textAlign: "right", marginTop: 2 }}>{syncMsg}</div>}
        <p style={{ margin: 0, fontSize: 13, color: t.textTer }}>
          {activeTasks.length} active task{activeTasks.length !== 1 ? "s" : ""}
          {urgentCount > 0 && <span style={{ color: "#D4883A", fontWeight: 600 }}>{" \u00B7 "}{urgentCount} due soon</span>}
        </p>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => { setEditTask(null); setShowForm(true); }} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: t.accent, color: t.accentText, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>+ Add Task</button>
        <button onClick={() => { setEditTrip(null); setShowTripForm(true); }} style={{ padding: "9px 14px", borderRadius: 8, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textSec, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>+ Trip</button>
        <button onClick={() => { setEditHabit(null); setShowHabitForm(true); }} style={{ padding: "9px 14px", borderRadius: 8, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textSec, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>+ Routine</button>
        <button onClick={() => { setAddingReading(true); }} style={{ padding: "9px 14px", borderRadius: 8, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textSec, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>+ Reading</button>
      </div>
      {/* Row 1: View switchers + Category filters */}
      <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        <button onClick={() => { setShowPlanner(!showPlanner); setShowRoutine(false); setShowTrips(false); setShowReading(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: showPlanner ? "#E05A7A" : t.borderBtn, background: showPlanner ? "#E05A7A18" : t.bgCard, color: showPlanner ? "#E05A7A" : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>📋 Planner</button>
        <button onClick={() => { setFilterCat("all"); setShowRoutine(false); setShowTrips(false); setShowPlanner(false); setShowReading(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: filterCat === "all" && !showRoutine && !showTrips && !showPlanner && !showReading ? t.textSec : t.borderBtn, background: filterCat === "all" && !showRoutine && !showTrips && !showPlanner && !showReading ? t.textSec : t.bgCard, color: filterCat === "all" && !showRoutine && !showTrips && !showPlanner && !showReading ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>All</button>
        {CATEGORIES.map(c => <button key={c.id} onClick={() => { setFilterCat(c.id); setShowRoutine(false); setShowTrips(false); setShowPlanner(false); setShowReading(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: filterCat === c.id && !showRoutine && !showTrips && !showPlanner && !showReading ? c.color : t.borderBtn, background: filterCat === c.id && !showRoutine && !showTrips && !showPlanner && !showReading ? c.color + "18" : t.bgCard, color: filterCat === c.id && !showRoutine && !showTrips && !showPlanner && !showReading ? c.color : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>{c.label}</button>)}
        <button onClick={() => { setShowRoutine(!showRoutine); setShowTrips(false); setShowPlanner(false); setShowReading(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: showRoutine ? t.accent : t.borderBtn, background: showRoutine ? t.accent : t.bgCard, color: showRoutine ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Daily Routine</button>
        <button onClick={() => { setShowReading(!showReading); setShowRoutine(false); setShowTrips(false); setShowPlanner(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: showReading ? "#10B981" : t.borderBtn, background: showReading ? "#10B98118" : t.bgCard, color: showReading ? "#10B981" : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>📚 Reading</button>
        {isMobile && <button onClick={() => { setShowTrips(!showTrips); setShowRoutine(false); setShowPlanner(false); setShowReading(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: showTrips ? t.accent : t.borderBtn, background: showTrips ? t.accent : t.bgCard, color: showTrips ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Trips</button>}
      </div>
      {/* Row 2: Status filters */}
      <div style={{ display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
        {(isMobile ? ["active", "closed"] : ["active", "closed", "all"]).map(s => <button key={s} onClick={() => setFilterStatus(s)} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: filterStatus === s ? t.accent : t.borderBtn, background: filterStatus === s ? t.accent : t.bgCard, color: filterStatus === s ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer", textTransform: "capitalize" }}>{s}</button>)}
      </div>

      {/* Mobile: week strip + habit + trips inline */}
      {isMobile && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: t.textSec }}>{new Date().toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</span>
            <button onClick={() => setShowMobileCal(!showMobileCal)} style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 8px", fontSize: 12, color: showMobileCal ? t.accent : t.textTer, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 14 }}>{"\uD83D\uDCC5"}</span> {showMobileCal ? "Hide" : "Calendar"}
            </button>
          </div>
          {showMobileCal && (
            <div style={{ background: t.bgSidebar, borderRadius: 10, padding: 12, border: "1px solid " + t.border, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <button onClick={() => changeMonth(-1)} style={navBtnStyleFn(t)}>{"\u25C2"}</button>
                <span style={{ fontSize: 13, fontWeight: 700 }}>{calDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</span>
                <button onClick={() => changeMonth(1)} style={navBtnStyleFn(t)}>{"\u25B8"}</button>
              </div>
              <MiniCalendar tasks={tasks} trips={trips} schedule={schedule} currentDate={calDate} selectedDate={selectedDate} onDateClick={handleDateClick} onDateLongPress={handleDateLongOrDouble} />
            </div>
          )}
          {!showMobileCal && <WeekStrip tasks={tasks} trips={trips} schedule={schedule} onDateClick={handleDateClick} onDateLongPress={handleDateLongOrDouble} selectedDate={selectedDate} />}
          {selectedDate && <div style={{ fontSize: 12, color: "#5B7FD1", fontWeight: 600, textAlign: "center", marginBottom: 8 }}>Showing: {formatDate(selectedDate)} <button onClick={() => setSelectedDate(null)} style={{ marginLeft: 8, background: "none", border: "none", color: t.textTer, cursor: "pointer", fontSize: 12 }}>{"\u2715"} clear</button></div>}
          <HabitTracker habits={habits} log={habitLog} onToggle={toggleHabit} />
        </div>
      )}

      {/* Main content area */}
      <div style={{ display: "flex", gap: 24, alignItems: "flex-start", flexWrap: "wrap" }}>
        {/* Desktop sidebar */}
        {!isMobile && (
        <div style={{ width: 260, flexShrink: 0, background: t.bgSidebar, borderRadius: 12, padding: 16, border: "1px solid " + t.border, boxShadow: "0 2px 8px rgba(0,0,0,0.03)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => changeMonth(-1)} style={navBtnStyleFn(t)}>{"\u25C2"}</button>
            <span style={{ fontSize: 14, fontWeight: 700 }}>{calDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</span>
            <button onClick={() => changeMonth(1)} style={navBtnStyleFn(t)}>{"\u25B8"}</button>
          </div>
          <MiniCalendar tasks={tasks} trips={trips} schedule={schedule} currentDate={calDate} selectedDate={selectedDate} onDateClick={handleDateClick} onDateLongPress={handleDateLongOrDouble} />
          {selectedDate && <div style={{ fontSize: 12, color: "#5B7FD1", fontWeight: 600, textAlign: "center" }}>Showing: {formatDate(selectedDate)} <button onClick={() => setSelectedDate(null)} style={{ marginLeft: 8, background: "none", border: "none", color: t.textTer, cursor: "pointer", fontSize: 12 }}>{"\u2715"} clear</button></div>}
          <HabitTracker habits={habits} log={habitLog} onToggle={toggleHabit} />
          <div style={{ marginTop: 14, borderTop: "1px solid " + t.borderLight, paddingTop: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: t.textTer, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>Summary</div>
            {CATEGORIES.map(c => { const count = tasks.filter(tt => tt.category === c.id && tt.status !== "noreply" && tt.status !== "success" && tt.status !== "reviewed").length; return <div key={c.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}><span style={{ color: t.textSec }}>{c.label}</span><span style={{ fontWeight: 700, color: c.color }}>{count}</span></div>; })}
          </div>
          {trips.length > 0 && (
            <div style={{ marginTop: 14, borderTop: "1px solid " + t.borderLight, paddingTop: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: t.textTer, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Trips</div>
              {[...trips].sort((a, b) => a.startDate.localeCompare(b.startDate)).map(trip => (
                <div key={trip.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, marginBottom: 6, gap: 4 }}>
                  <div style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    <span style={{ fontWeight: 600, color: t.textSec }}>{trip.title}</span>
                    <span style={{ color: t.textQuad }}> · {formatDate(trip.startDate)}–{formatDate(trip.endDate)}</span>
                  </div>
                  <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
                    <button onClick={() => handleEditTrip(trip)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 11, padding: 2 }}>{"\u270E"}</button>
                    <button onClick={() => deleteTrip(trip.id)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 13, padding: 2 }}>{"\u2715"}</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        )}
        <div style={{ flex: 1, minWidth: isMobile ? 0 : 300 }}>
          {recentlyDeleted.map(d => (
            <div key={d.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 14px", marginBottom: 10, borderRadius: 10, background: t.undoBg, border: "1px solid " + t.undoBorder }}>
              <span style={{ fontSize: 13, color: t.undoText, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                Deleted <strong>{d.title}</strong>
              </span>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                <button onClick={() => undoDelete(d.id)} style={{ padding: "4px 12px", borderRadius: 6, border: "none", background: t.accent, color: t.accentText, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Undo</button>
                <button onClick={() => dismissUndo(d.id)} style={{ padding: "4px 8px", borderRadius: 6, border: "none", background: "transparent", color: t.textTer, fontSize: 14, cursor: "pointer", lineHeight: 1 }}>{"\u2715"}</button>
              </div>
            </div>
          ))}
          {showReading ? (
            <ReadingList readings={readings} onSave={saveReadings} tags={readingTags} onSaveTags={saveReadingTags} />
          ) : showPlanner ? (
            <PlannerView tasks={tasks} readings={readings} schedule={schedule} onOpenAssign={handleDateLongOrDouble} onUnassign={unassignFromDate} calDate={calDate} />
          ) : showTrips ? (
            <div style={{ background: t.bgCard, borderRadius: 12, padding: 18, border: "1px solid " + t.border, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
              <h3 style={{ fontSize: 15, fontWeight: 700, color: t.text, margin: "0 0 14px" }}>All Trips</h3>
              {trips.length === 0 ? (
                <div style={{ textAlign: "center", padding: "30px 20px", color: t.textFaint, fontSize: 13 }}>No trips yet — tap "+ Trip" to add one.</div>
              ) : (
                [...trips].sort((a, b) => a.startDate.localeCompare(b.startDate)).map(trip => (
                  <div key={trip.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, marginBottom: 10, padding: "10px 12px", borderRadius: 8, background: t.bgEmpty, border: "1px solid " + t.borderLight, gap: 8 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 600, color: t.text, marginBottom: 2 }}>{trip.title}</div>
                      <div style={{ fontSize: 12, color: t.textTer }}>{formatDate(trip.startDate)} – {formatDate(trip.endDate)}</div>
                      {trip.notes && <div style={{ fontSize: 11, color: t.textQuad, marginTop: 2 }}>{trip.notes}</div>}
                    </div>
                    <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                      <button onClick={() => handleEditTrip(trip)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 12, padding: 2 }}>{"\u270E"}</button>
                      <button onClick={() => deleteTrip(trip.id)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 14, padding: 2 }}>{"\u2715"}</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          ) : showRoutine ? (
            <MonthlyRoutine habits={habits} log={habitLog} onToggle={toggleHabit} calDate={calDate} onEditHabit={handleEditHabit} onDeleteHabit={deleteHabit} />
          ) : sorted.length === 0 ? (
            <div style={{ textAlign: "center", padding: "50px 20px", color: t.textFaint, fontSize: 14, background: t.bgEmpty, borderRadius: 12, border: "1px dashed " + t.borderBtn }}>
              {tasks.length === 0 ? 'No tasks yet \u2014 tap "+ Add Task" to get started.' : "No tasks match the current filters."}
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sorted.map(task => task.category === "paper"
                ? <PaperCard key={task.id} task={task} onEdit={handleEdit} onDelete={deleteTask} onUpdatePaper={updatePaper} onStatusChange={changeStatus} scheduledToday={todayScheduledIds.has(task.id)} schedule={schedule} />
                : <TaskCard key={task.id} task={task} onStatusChange={changeStatus} onDelete={deleteTask} onEdit={handleEdit} scheduledToday={todayScheduledIds.has(task.id)} schedule={schedule} />
              )}
            </div>
          )}
        </div>
      </div>
      {showForm && <TaskForm onAdd={addTask} onClose={() => { setShowForm(false); setEditTask(null); }} editTask={editTask} onSaveEdit={saveEdit} />}
      {showTripForm && <TripForm onAdd={addTrip} onClose={() => { setShowTripForm(false); setEditTrip(null); }} editTrip={editTrip} onSaveEdit={saveEditTrip} />}
      {showHabitForm && <HabitForm onAdd={addHabit} onClose={() => { setShowHabitForm(false); setEditHabit(null); }} editHabit={editHabit} onSaveEdit={saveEditHabit} />}
      {assignDate && <AssignPanel date={assignDate} tasks={tasks} readings={readings} schedule={schedule} onAssign={assignToDate} onUnassign={unassignFromDate} onClose={() => setAssignDate(null)} />}
      {addingReading && <ReadingForm onAdd={(entries) => { const existing = new Set(readings.map(r => r.citeKey).filter(Boolean)); const fresh = entries.filter(e => !e.citeKey || !existing.has(e.citeKey)); if (fresh.length > 0) saveReadings([...readings, ...fresh]); }} onClose={() => setAddingReading(false)} />}
    </div>
    </ThemeCtx.Provider>
  );
}



const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AcademicTracker));
</script>
</body>
</html>
