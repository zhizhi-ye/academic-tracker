<script>
if (!window.storage) {
  window.storage = {
    async get(key) { const val = localStorage.getItem("at:" + key); if (val === null) return null; return { key: key, value: val }; },
    async set(key, value) { localStorage.setItem("at:" + key, value); return { key: key, value: value }; },
    async delete(key) { localStorage.removeItem("at:" + key); return { key: key, deleted: true }; },
    async list(prefix) { const keys = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("at:")) { const realKey = k.slice(3); if (!prefix || realKey.startsWith(prefix)) keys.push(realKey); } } return { keys: keys }; }
  };
}
</script>

function useTheme() {
  const [dark, setDark] = useState(() => window.matchMedia?.("(prefers-color-scheme: dark)").matches || false);
  useEffect(() => {
    const mq = window.matchMedia?.("(prefers-color-scheme: dark)");
    if (!mq) return;
    const handler = (e) => setDark(e.matches);
    mq.addEventListener("change", handler);
    return () => mq.removeEventListener("change", handler);
  }, []);
  return dark ? DARK : LIGHT;
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatDate(s) { if (!s) return "\u2014"; const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
function daysBetween(s) { if (!s) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.ceil((new Date(s + "T00:00:00") - t) / 864e5); }

function daysSinceCreated(createdAt) {
  if (!createdAt) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.floor((t - new Date(createdAt + "T00:00:00")) / 864e5);
}
function needsReminder(task) {
  if (task.deadline) return false;
  const closed = ["noreply", "success", "reviewed", "notapplied", "nointerview"];
  if (closed.includes(task.status)) return false;
  const days = daysSinceCreated(task.createdAt);
  if (days === null) return false;
  return days > 0 && days % 3 === 0;
}

function downloadICS(task) {
  const cat = CATEGORIES.find(c => c.id === task.category);
  const catLabel = cat ? cat.label : "Task";
  const dateStr = task.deadline;
  if (!dateStr) return;
  const d = dateStr.replace(/-/g, "");
  let dtStart, dtEnd;
  if (task.deadlineTime) {
    const timeParts = task.deadlineTime.replace(/[^0-9:]/g, "").split(":");
    const hh = (timeParts[0] || "00").padStart(2, "0");
    const mm = (timeParts[1] || "00").padStart(2, "0");
    dtStart = d + "T" + hh + mm + "00";
    const endH = String(Math.min(23, parseInt(hh) + 1)).padStart(2, "0");
    dtEnd = d + "T" + endH + mm + "00";
  } else {
    const next = new Date(dateStr + "T00:00:00");
    next.setDate(next.getDate() + 1);
    const nd = localDateStr(next).replace(/-/g, "");
    dtStart = d; dtEnd = nd;
  }
  const esc = (s) => (s || "").replace(/[\\;,\n]/g, (m) => m === "\n" ? "\\n" : "\\" + m);
  const uid = task.id + "@academic-tracker";
  const now = new Date();
  const stamp = now.getFullYear().toString() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0") + "T" + String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0");
  const isAllDay = !task.deadlineTime;
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//AcademicTracker//EN",
    "BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + stamp,
    isAllDay ? "DTSTART;VALUE=DATE:" + dtStart : "DTSTART:" + dtStart,
    isAllDay ? "DTEND;VALUE=DATE:" + dtEnd : "DTEND:" + dtEnd,
    "SUMMARY:" + esc("[" + catLabel + "] " + task.title),
    "DESCRIPTION:" + esc((task.notes || "") + (task.url ? "\\n" + task.url : "")),
    "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY",
    "DESCRIPTION:Due tomorrow: " + esc(task.title), "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ];
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url;
  a.download = task.title.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_").slice(0, 40) + ".ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function localDateStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function getRecentDays(n) {
  const days = [];
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) {
    const dt = new Date(d); dt.setDate(d.getDate() - i);
    days.push(localDateStr(dt));
  }
  return days;
}

function datesInRange(start, end) {
  const dates = [];
  const s = new Date(start + "T00:00:00");
  const e = new Date(end + "T00:00:00");
  while (s <= e) {
    const y = s.getFullYear();
    const m = String(s.getMonth() + 1).padStart(2, "0");
    const d = String(s.getDate()).padStart(2, "0");
    dates.push(y + "-" + m + "-" + d);
    s.setDate(s.getDate() + 1);
  }
  return dates;
}

function DeadlineBadge({ dateStr, label, submitted, time }) {
  const days = daysBetween(dateStr);
  if (days === null) return null;
  if (submitted && label === "Deadline") return <span style={{ fontSize: 11, color: "#2A5DB0", fontWeight: 600 }}>Submitted {formatDate(dateStr)}</span>;
  let color = "#888";
  if (days < 0) { color = "#B04040"; }
  else if (days <= 3) { color = "#D4883A"; }
  else if (days <= 7) { color = "#5B7FD1"; }
  else { color = "#6BAB73"; }
  return <span style={{ fontSize: 11, color, fontWeight: 600 }}>{label}: {formatDate(dateStr)}{time ? " · " + time : ""}</span>;
}

function StatusBtn({ label, color, onClick }) {
  return <button onClick={onClick} style={{ flex: 1, padding: "7px 4px", borderRadius: 7, border: "1.5px solid " + color + "30", background: color + "0C", color, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>{label}</button>;

function TaskForm({ onAdd, onClose, editTask, onSaveEdit }) {
  const t = React.useContext(ThemeCtx);
  const [title, setTitle] = useState(editTask ? editTask.title : "");

  const [deadlineTime, setDeadlineTime] = useState(editTask ? editTask.deadlineTime || "" : "");
  const [secondDate, setSecondDate] = useState(editTask ? (editTask.category === "job" ? editTask.interviewDate : editTask.notificationDate) || "" : "");
  const [confDate, setConfDate] = useState(editTask ? editTask.conferenceDate || "" : "");
  const [notes, setNotes] = useState(editTask ? editTask.notes : "");
  const [status, setStatus] = useState(editTask ? editTask.status : "pending");
  const [paperTarget, setPaperTarget] = useState(editTask ? editTask.paperTarget || "" : "");
  const isPaper = category === "paper";
  const ok = title.trim();
  const isJob = category === "job";
  const isReview = category === "review";
  const isEditing = !!editTask;
  const handleSubmit = () => {
    if (!ok) return;
    const base = { title: title.trim(), url: url.trim(), category, deadline, deadlineTime: deadlineTime.trim(), interviewDate: isJob ? secondDate : "", notificationDate: category === "cfp" ? secondDate : "", conferenceDate: category === "cfp" ? confDate : "", notes: notes.trim(), paperTarget: isPaper ? paperTarget.trim() : "", ...(isPaper && !isEditing ? { paperPhases: { rq: "", method: "", structure: false }, paperSections: PAPER_SECTIONS_DEFAULT.map(s => ({ ...s, d1: [...s.d1] })) } : {}) };
    if (isEditing) {
      onSaveEdit({ ...editTask, ...base, status });
    } else {
      onAdd({ id: generateId(), ...base, status: "pending", createdAt: new Date().toISOString().slice(0, 10) });
    }
    onClose();
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: t.bgModal, borderRadius: 14, padding: "28px 30px", width: "min(460px,92vw)", boxShadow: "0 20px 60px rgba(0,0,0,0.18)", maxHeight: "90vh", overflowY: "auto" }}>
        <h3 style={{ margin: "0 0 20px", fontSize: 18, fontWeight: 700, color: t.text }}>{isEditing ? "Edit Task" : "Add New Task"}</h3>
        <label style={labelStyleFn(t)}>Title *</label>
        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Museum Educator / ICML 2027" style={inputStyleFn(t)} />
        <label style={labelStyleFn(t)}>Link (URL)</label>
        <input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://..." style={inputStyleFn(t)} />
        <label style={labelStyleFn(t)}>Category</label>
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          {CATEGORIES.map(c => <button key={c.id} onClick={() => setCategory(c.id)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, border: "2px solid", borderColor: category === c.id ? c.color : "#e0e0e0", background: category === c.id ? c.color + "18" : t.bgEmpty, color: category === c.id ? c.color : "#777", fontWeight: 600, fontSize: 12, cursor: "pointer" }}>{c.label}</button>)}
        </div>
        {isPaper && (
          <><label style={labelStyleFn(t)}>Target Journal / Venue</label>
          <input value={paperTarget} onChange={e => setPaperTarget(e.target.value)} placeholder="e.g. Humanities & Social Sciences Communications" style={inputStyleFn(t)} /></>
        )}
        <div style={{ display: "flex", gap: 14 }}>
          <div style={{ flex: 2 }}><label style={labelStyleFn(t)}>{isReview ? "Review Deadline" : isPaper ? "Deadline (optional)" : "Submission Deadline"}</label><input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} style={inputStyleFn(t)} /></div>
          <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>Time</label><input value={deadlineTime} onChange={e => setDeadlineTime(e.target.value)} placeholder="e.g. 17:00" style={inputStyleFn(t)} /></div>
        </div>
        {!isReview && !isPaper && (
          <div style={{ display: "flex", gap: 14 }}>
            <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>{isJob ? "Interview Date" : "Notification Date"}</label><input type="date" value={secondDate} onChange={e => setSecondDate(e.target.value)} style={inputStyleFn(t)} /></div>
          </div>
        )}
        {category === "cfp" && <div><label style={labelStyleFn(t)}>Conference Date</label><input type="date" value={confDate} onChange={e => setConfDate(e.target.value)} style={inputStyleFn(t)} /></div>}
        <label style={labelStyleFn(t)}>Notes</label>
        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} placeholder="Any extra details..." style={{ ...inputStyleFn(t), resize: "vertical" }} />

          <div>
            <label style={labelStyleFn(t)}>Status</label>
            <select value={status} onChange={e => setStatus(e.target.value)} style={{ ...inputStyleFn(t), cursor: "pointer", appearance: "auto" }}>
              {Object.entries(STATUS).filter(([key]) => {
                const paperOnly = ["writing", "finished", "submitted", "accepted", "correction", "rejected"];
                const nonPaper = ["applied", "interview", "notification", "reviewed", "nointerview", "noreply", "notapplied", "success"];
                if (isPaper) return !nonPaper.includes(key);
                return !paperOnly.includes(key);
              }).map(([key, val]) => (
                <option key={key} value={key}>{val.label}</option>
              ))}
            </select>
          </div>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1px solid #ddd", background: t.bgEmpty, color: t.textSec, fontWeight: 600, cursor: "pointer", fontSize: 14 }}>Cancel</button>
          <button onClick={handleSubmit} disabled={!ok} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "none", background: ok ? t.accent : t.textFaint, color: "#fff", fontWeight: 600, cursor: ok ? "pointer" : "default", fontSize: 14 }}>{isEditing ? "Save" : "Add Task"}</button>

}

function getScheduledDates(schedule, taskId) {
  const dates = [];
  Object.entries(schedule || {}).forEach(([dateStr, items]) => {
    if (items.some(a => a.taskId === taskId)) dates.push(dateStr);
  });
  dates.sort();
  return dates;
}

function ScheduledDatesBadges({ dates }) {
  const t = React.useContext(ThemeCtx);
  if (!dates || dates.length === 0) return null;
  const todayStr = localDateStr(new Date());
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
      <span style={{ fontSize: 10, color: t.textTer }}>📅</span>
      {dates.map(ds => {
        const d = new Date(ds + "T00:00:00");
        const isToday = ds === todayStr;
        const isPast = d < today;
        return (
          <span key={ds} style={{
            fontSize: 9, fontWeight: 600, padding: "1px 5px", borderRadius: 3,
            background: isToday ? t.accent + "18" : isPast ? t.bgEmpty : t.accent + "08",
            color: isToday ? t.accent : isPast ? t.textFaint : t.textSec,
            textDecoration: isPast ? "line-through" : "none",
          }}>
            {d.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
          </span>
        );
      })}
    </span>
  );
}

function TaskCard({ task, onStatusChange, onDelete, onEdit, scheduledToday, schedule }) {
  const [confirming, setConfirming] = useState(false);
  const t = React.useContext(ThemeCtx);
  const cat = CATEGORIES.find(c => c.id === task.category) || CATEGORIES[0];
  const st = STATUS[task.status] || STATUS.pending;
  const closed = task.status === "noreply" || task.status === "success" || task.status === "reviewed" || task.status === "notapplied" || task.status === "nointerview";
  const isJob = task.category === "job";
  const isReview = task.category === "review";
  const submitted = !isReview && (task.status === "applied" || task.status === "interview" || task.status === "notification" || task.status === "success" || task.status === "nointerview");
  const secondLabel = isJob ? "Interview" : "Notification";

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>

            <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 4, background: st.bg, color: st.fg }}>{st.label}</span>
            {scheduledToday && <span style={{ fontSize: 9, fontWeight: 700, color: t.accent, background: t.accent + "15", padding: "2px 6px", borderRadius: 3 }}>📌 TODAY</span>}
            <ScheduledDatesBadges dates={getScheduledDates(schedule, task.id)} />
          </div>
          <div style={{ fontSize: 15, fontWeight: 600, color: t.text, marginBottom: 4, lineHeight: 1.3 }}>
            {task.url ? <a href={task.url} target="_blank" rel="noopener noreferrer" style={{ color: t.text, textDecoration: "none", borderBottom: "1px dashed " + t.textQuad }}>{task.title} {"\u2197"}</a> : task.title}
          </div>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 6 }}>
            <DeadlineBadge dateStr={task.deadline} label="Deadline" submitted={submitted} time={task.deadlineTime} />
            {secondVal && <DeadlineBadge dateStr={secondVal} label={secondLabel} submitted={false} />}
            {!isReview && task.conferenceDate && <DeadlineBadge dateStr={task.conferenceDate} label="Conference" submitted={false} />}
            {!task.deadline && needsReminder(task) && <span style={{ fontSize: 11, color: "#D4883A", fontWeight: 600 }}>⏰ No deadline — check on this</span>}
            {!task.deadline && !needsReminder(task) && !submitted && <span style={{ fontSize: 11, color: "#aaa" }}>No deadline set</span>}
          </div>
          {task.notes && <div style={{ fontSize: 12, color: t.textTer, marginTop: 6, lineHeight: 1.4 }}>{task.notes}</div>}
        </div>
        <div style={{ display: "flex", gap: 2, flexShrink: 0, alignItems: "center" }}>
          {!confirming ? (
            <>
              {task.deadline && <button onClick={() => downloadICS(task)} title="Add to Calendar (.ics)" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 13, padding: 4, lineHeight: 1 }}>📅</button>}
              <button onClick={() => onEdit(task)} title="Edit" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 13, padding: 4, lineHeight: 1 }}>{"\u270E"}</button>
              <button onClick={() => setConfirming(true)} title="Delete" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 16, padding: 4, lineHeight: 1 }}>{"\u2715"}</button>
            </>
          ) : (
            <div style={{ display: "flex", gap: 4 }}>
              <button onClick={() => onDelete(task.id)} style={{ padding: "3px 8px", borderRadius: 5, border: "none", background: "#B04040", color: "#fff", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Delete</button>
              <button onClick={() => setConfirming(false)} style={{ padding: "3px 8px", borderRadius: 5, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textTer, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
            </div>
          )}
        </div>
      </div>
      {!closed && (
        <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
          {isReview ? (
            <StatusBtn label="Reviewed" color="#8B5CF6" onClick={() => onStatusChange(task.id, "reviewed")} />
          ) : (
            <>
              {task.status === "pending" && <StatusBtn label="Applied" color="#5B7FD1" onClick={() => onStatusChange(task.id, "applied")} />}
              {task.status === "applied" && <StatusBtn label="Applied ✓" color="#5B7FD1" onClick={() => onStatusChange(task.id, "pending")} />}
              {isJob && (task.status === "pending" || task.status === "applied") && <StatusBtn label="Interview" color="#D4883A" onClick={() => onStatusChange(task.id, "interview")} />}
              {!isJob && (task.status === "pending" || task.status === "applied") && <StatusBtn label="Awaiting Result" color="#D4883A" onClick={() => onStatusChange(task.id, "notification")} />}
              {(task.status === "applied" || task.status === "interview") && <StatusBtn label="No Interview" color="#8B4040" onClick={() => onStatusChange(task.id, "nointerview")} />}
              <StatusBtn label="Got It!" color="#2A7A3A" onClick={() => onStatusChange(task.id, "success")} />
            </>
          )}
        </div>
      )}
      {closed && (
        <div style={{ marginTop: 10 }}>
          <button onClick={() => onStatusChange(task.id, "pending")} style={{ fontSize: 11, color: t.textTer, background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 10px", cursor: "pointer" }}>{"\u21A9"} Reopen</button>
        </div>
      )}
    </div>
  );
}

function PaperCard({ task, onEdit, onDelete, onUpdatePaper, onStatusChange, scheduledToday, schedule }) {
  const [confirming, setConfirming] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const [editingPhase, setEditingPhase] = useState(null);
  const t = React.useContext(ThemeCtx);
  const cat = CATEGORIES.find(c => c.id === "paper");
  const st = STATUS[task.status] || STATUS.pending;
  const closed = task.status === "accepted" || task.status === "rejected";
  // Migrate old array format to new object format
  const rawPhases = task.paperPhases;
  const phases = Array.isArray(rawPhases)
    ? { rq: rawPhases[0] ? "✓" : "", method: rawPhases[1] ? "✓" : "", structure: !!rawPhases[2] }
    : (rawPhases || { rq: "", method: "", structure: false });
  const sections = task.paperSections || PAPER_SECTIONS_DEFAULT;
  const totalWords = sections.reduce((s, sec) => s + (sec.words > 0 ? sec.words : 0), 0);
  const totalTarget = sections.reduce((s, sec) => s + (sec.target > 0 ? sec.target : 0), 0);
  const totalChecks = sections.reduce((s, sec) => s + sec.d1.filter(Boolean).length + (sec.d2 ? 1 : 0) + (sec.final ? 1 : 0), 0);
  const maxChecks = sections.length * 5;
  const updatePhase = (key, value) => { onUpdatePaper(task.id, { paperPhases: { ...phases, [key]: value } }); };
  const updateSection = (secIdx, field, value) => {
    const ns = sections.map((sec, i) => {
      if (i !== secIdx) return sec;
      if (field === "words") return { ...sec, words: Math.max(0, parseInt(value) || 0) };
      if (field === "target") return { ...sec, target: Math.max(0, parseInt(value) || 0) };
      if (field.startsWith("d1-")) { const di = parseInt(field.split("-")[1]); const nd1 = [...sec.d1]; nd1[di] = !nd1[di]; return { ...sec, d1: nd1 }; }
      if (field === "d2") return { ...sec, d2: !sec.d2 };
      if (field === "final") return { ...sec, final: !sec.final };
      return sec;
    });
    onUpdatePaper(task.id, { paperSections: ns });
  };
  const addSection = () => { const name = prompt("Section name:"); if (!name || !name.trim()) return; const ns = [...sections, { id: generateId(), name: name.trim(), target: 0, words: 0, d1: [false, false, false], d2: false, final: false }]; onUpdatePaper(task.id, { paperSections: ns }); };
  const removeSection = (secIdx) => { onUpdatePaper(task.id, { paperSections: sections.filter((_, i) => i !== secIdx) }); };
  const Check = ({ checked, onClick, color }) => (
    <button onClick={onClick} style={{ width: 16, height: 16, borderRadius: 3, border: checked ? "none" : "1.5px solid " + t.borderInput, background: checked ? color : "transparent", cursor: "pointer", padding: 0, display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0, WebkitTapHighlightColor: "transparent", transition: "background 0.15s" }}>
      {checked && <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5.5L4 7.5L8 3" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
    </button>
  );
  const phaseHasContent = (ph) => ph.type === "text" ? !!phases[ph.id] : !!phases[ph.id];
  const overallPct = totalTarget > 0 ? Math.min(100, Math.round(totalWords / totalTarget * 100)) : null;
  return (
    <div style={{ background: closed ? t.bgCardClosed : t.bgCard, borderRadius: 12, padding: "16px 18px", border: scheduledToday ? "1.5px solid " + t.accent : "1px solid " + (closed ? t.borderLight : t.border), opacity: closed ? 0.6 : 1, boxShadow: closed ? "none" : scheduledToday ? "0 2px 12px " + t.accent + "20" : "0 2px 8px rgba(0,0,0,0.04)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", color: cat.color, background: cat.color + "15", padding: "2px 8px", borderRadius: 4 }}>📝 {cat.label}</span>
            <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 4, background: st.bg, color: st.fg }}>{st.label}</span>
            {scheduledToday && <span style={{ fontSize: 9, fontWeight: 700, color: t.accent, background: t.accent + "15", padding: "2px 6px", borderRadius: 3 }}>📌 TODAY</span>}
            <ScheduledDatesBadges dates={getScheduledDates(schedule, task.id)} />
          </div>
          <div style={{ fontSize: 15, fontWeight: 600, color: t.text, marginBottom: 2, lineHeight: 1.3 }}>
            {task.url ? <a href={task.url} target="_blank" rel="noopener noreferrer" style={{ color: t.text, textDecoration: "none", borderBottom: "1px dashed " + t.textQuad }}>{task.title} ↗</a> : task.title}
          </div>
          {task.paperTarget && <div style={{ fontSize: 11, color: t.textTer, marginBottom: 6 }}>Target: {task.paperTarget}</div>}
        </div>
        <div style={{ display: "flex", gap: 2, flexShrink: 0, alignItems: "center" }}>
          {!confirming ? (<>
            <button onClick={() => onEdit(task)} title="Edit" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 13, padding: 4, lineHeight: 1 }}>✎</button>
            <button onClick={() => setConfirming(true)} title="Delete" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 16, padding: 4, lineHeight: 1 }}>✕</button>
          </>) : (<div style={{ display: "flex", gap: 4 }}>
            <button onClick={() => onDelete(task.id)} style={{ padding: "3px 8px", borderRadius: 5, border: "none", background: "#B04040", color: "#fff", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Delete</button>
            <button onClick={() => setConfirming(false)} style={{ padding: "3px 8px", borderRadius: 5, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textTer, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
          </div>)}
        </div>
      </div>

      {/* Phase chips */}
      <div style={{ display: "flex", gap: 6, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
        {PAPER_PHASES.map(ph => {
          const filled = phaseHasContent(ph);
          const handler = ph.type === "text"
            ? () => setEditingPhase(editingPhase === ph.id ? null : ph.id)
            : () => updatePhase(ph.id, !phases[ph.id]);
          return (
            <button key={ph.id} onClick={handler} style={{ padding: "3px 10px", borderRadius: 20, border: "1.5px solid " + (filled ? cat.color : t.borderBtn), background: filled ? cat.color : "transparent", color: filled ? "#fff" : t.textTer, fontWeight: 600, fontSize: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, letterSpacing: "0.02em", transition: "all 0.15s" }}>
              {ph.label}
            </button>
          );
        })}
      </div>

      {/* RQ / Method text field */}
      {editingPhase && PAPER_PHASES.find(p => p.id === editingPhase && p.type === "text") && (
        <div style={{ marginTop: 8 }}>
          <textarea value={phases[editingPhase] || ""} onChange={e => updatePhase(editingPhase, e.target.value)} placeholder={PAPER_PHASES.find(p => p.id === editingPhase).label + "..."} rows={2} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid " + t.borderLight, fontSize: 12, fontFamily: "inherit", background: t.bgEmpty, color: t.text, resize: "vertical", outline: "none", boxSizing: "border-box", lineHeight: 1.5 }} />
        </div>
      )}

      {/* Progress bar + summary */}
      <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ flex: 1, height: 4, borderRadius: 2, background: t.borderLight, overflow: "hidden" }}>
          <div style={{ height: "100%", borderRadius: 2, background: overallPct !== null && overallPct >= 100 ? "#2A7A3A" : cat.color, width: (overallPct !== null ? overallPct : (totalChecks / maxChecks * 100)) + "%", transition: "width 0.3s" }} />
        </div>
        <span style={{ fontSize: 10, color: t.textTer, fontWeight: 600, whiteSpace: "nowrap" }}>{totalWords.toLocaleString()}{totalTarget > 0 ? "/" + totalTarget.toLocaleString() : ""}w · {totalChecks}/{maxChecks}</span>
      </div>

      {/* Expand toggle */}
      <button onClick={() => setExpanded(!expanded)} style={{ marginTop: 8, background: "none", border: "none", cursor: "pointer", color: t.textQuad, fontSize: 10, fontWeight: 600, padding: 0, letterSpacing: "0.03em" }}>
        {expanded ? "▾ HIDE DETAILS" : "▸ WRITING PROGRESS"}
      </button>

      {expanded && (
        <div style={{ marginTop: 8 }}>
          {sections.map((sec, si) => {
            const noWords = sec.words === -1 || sec.target === -1 || sec.id === "ref";
            const pct = !noWords && sec.target > 0 ? Math.min(100, Math.round((sec.words || 0) / sec.target * 100)) : null;
            return (
              <div key={sec.id} style={{ display: "flex", alignItems: "center", gap: 0, padding: "7px 0", borderBottom: "1px solid " + t.borderLight }}>
                {/* Section name */}
                <div style={{ width: "22%", minWidth: 70, fontSize: 12, color: t.text, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", paddingRight: 6 }}>{sec.name}</div>
                {/* Target + Words */}
                <div style={{ width: "22%", display: "flex", alignItems: "center", gap: 3, justifyContent: "center" }}>
                  {noWords ? <span style={{ color: t.textFaint, fontSize: 10 }}>—</span> : (<>
                    <input type="number" value={sec.words || ""} onChange={e => updateSection(si, "words", e.target.value)} placeholder="0" style={{ width: 36, padding: "2px 3px", borderRadius: 3, border: "none", background: t.bgEmpty, fontSize: 10, textAlign: "center", color: t.text, fontWeight: 600, fontFamily: "inherit", outline: "none" }} />
                    <span style={{ color: t.textFaint, fontSize: 9 }}>/</span>
                    <input type="number" value={sec.target || ""} onChange={e => updateSection(si, "target", e.target.value)} placeholder="—" style={{ width: 36, padding: "2px 3px", borderRadius: 3, border: "none", background: t.bgEmpty, fontSize: 10, textAlign: "center", color: t.textQuad, fontFamily: "inherit", outline: "none" }} />
                    {pct !== null && <span style={{ fontSize: 9, color: pct >= 100 ? "#2A7A3A" : pct >= 60 ? cat.color : t.textFaint, fontWeight: 600, minWidth: 22 }}>{pct}%</span>}
                  </>)}
                </div>
                {/* Draft checkboxes */}
                <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 3, justifyContent: "center" }}>
                  {[0, 1, 2].map(di => <Check key={di} checked={sec.d1[di]} onClick={() => updateSection(si, "d1-" + di)} color={cat.color} />)}
                  <span style={{ width: 6 }} />
                  <Check checked={sec.d2} onClick={() => updateSection(si, "d2")} color="#D4883A" />
                  <span style={{ width: 4 }} />
                  <Check checked={sec.final} onClick={() => updateSection(si, "final")} color="#2A7A3A" />
                </div>
                {/* Remove */}
                <button onClick={() => removeSection(si)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 10, padding: "0 2px", lineHeight: 1, opacity: 0.5 }}>✕</button>
              </div>
            );
          })}
          {/* Column labels - subtle, below content */}
          <div style={{ display: "flex", alignItems: "center", gap: 0, padding: "6px 0 2px", opacity: 0.5 }}>
            <div style={{ width: "22%", minWidth: 70 }} />
            <div style={{ width: "22%", fontSize: 8, textAlign: "center", color: t.textQuad, fontWeight: 600, letterSpacing: "0.05em" }}>WORDS / TARGET</div>
            <div style={{ flex: 1, display: "flex", justifyContent: "center", gap: 2 }}>
              <span style={{ fontSize: 8, color: t.textQuad, fontWeight: 600, letterSpacing: "0.05em" }}>1st · 1st · 1st</span>
              <span style={{ width: 6 }} />
              <span style={{ fontSize: 8, color: t.textQuad, fontWeight: 600 }}>2nd</span>
              <span style={{ width: 4 }} />
              <span style={{ fontSize: 8, color: t.textQuad, fontWeight: 600 }}>FIN</span>
            </div>
            <div style={{ width: 14 }} />
          </div>
          <button onClick={addSection} style={{ marginTop: 6, background: "none", border: "none", padding: 0, fontSize: 11, color: t.textQuad, cursor: "pointer", fontWeight: 500 }}>+ add section</button>
        </div>
      )}

      {task.notes && <div style={{ fontSize: 12, color: t.textTer, marginTop: 8, lineHeight: 1.4 }}>{task.notes}</div>}
      {task.deadline && <div style={{ marginTop: 6 }}><DeadlineBadge dateStr={task.deadline} label="Deadline" submitted={task.status === "submitted" || task.status === "accepted"} time={task.deadlineTime} /></div>}
      {!task.deadline && needsReminder(task) && <div style={{ marginTop: 6 }}><span style={{ fontSize: 11, color: "#D4883A", fontWeight: 600 }}>⏰ No deadline — check on this</span></div>}

      {/* Status buttons - compact inline */}
      {!closed && (
        <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
          {(task.status === "pending") && <StatusBtn label="Writing" color="#C62828" onClick={() => onStatusChange(task.id, "writing")} />}
          {(task.status === "writing") && <StatusBtn label="Finished" color="#3949AB" onClick={() => onStatusChange(task.id, "finished")} />}
          {(task.status === "finished") && <StatusBtn label="Submitted" color="#2A5DB0" onClick={() => onStatusChange(task.id, "submitted")} />}
          {(task.status === "submitted") && <StatusBtn label="Accepted" color="#2A7A3A" onClick={() => onStatusChange(task.id, "accepted")} />}
          {(task.status === "submitted") && <StatusBtn label="Correction" color="#9A6D1F" onClick={() => onStatusChange(task.id, "correction")} />}
          {(task.status === "submitted") && <StatusBtn label="Rejected" color="#B04040" onClick={() => onStatusChange(task.id, "rejected")} />}
          {(task.status === "correction") && <StatusBtn label="Submitted" color="#2A5DB0" onClick={() => onStatusChange(task.id, "submitted")} />}
          {(task.status === "correction") && <StatusBtn label="Accepted" color="#2A7A3A" onClick={() => onStatusChange(task.id, "accepted")} />}
        </div>
      )}
      {closed && (
        <div style={{ marginTop: 8 }}>
          <button onClick={() => onStatusChange(task.id, "writing")} style={{ fontSize: 11, color: t.textTer, background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 10px", cursor: "pointer" }}>{"\u21A9"} Reopen</button>
        </div>
      )}
    </div>
  );
}

function TripForm({ onAdd, onClose, editTrip, onSaveEdit }) {
  const t = React.useContext(ThemeCtx);
  const [title, setTitle] = useState(editTrip ? editTrip.title : "");
  const [startDate, setStartDate] = useState(editTrip ? editTrip.startDate : "");
  const [endDate, setEndDate] = useState(editTrip ? editTrip.endDate : "");
  const [notes, setNotes] = useState(editTrip ? editTrip.notes || "" : "");
  const ok = title.trim() && startDate && endDate && startDate <= endDate;
  const isEditing = !!editTrip;
  const handleSubmit = () => {
    if (!ok) return;
    if (isEditing) {
      onSaveEdit({ ...editTrip, title: title.trim(), startDate, endDate, notes: notes.trim() });
    } else {
      onAdd({ id: generateId(), title: title.trim(), startDate, endDate, notes: notes.trim() });
    }
    onClose();
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: t.bgModal, borderRadius: 14, padding: "28px 30px", width: "min(400px,92vw)", boxShadow: "0 20px 60px rgba(0,0,0,0.18)" }}>
        <h3 style={{ margin: "0 0 20px", fontSize: 18, fontWeight: 700, color: t.text }}>{isEditing ? "Edit Trip" : "Add Trip"}</h3>
        <label style={labelStyleFn(t)}>Destination *</label>
        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. York, Edinburgh" style={inputStyleFn(t)} />
        <div style={{ display: "flex", gap: 14 }}>
          <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>From *</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={inputStyleFn(t)} /></div>
          <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>To *</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={inputStyleFn(t)} /></div>
        </div>
        <label style={labelStyleFn(t)}>Notes</label>
        <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Holiday, conference, etc." style={inputStyleFn(t)} />
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1px solid #ddd", background: t.bgEmpty, color: t.textSec, fontWeight: 600, cursor: "pointer", fontSize: 14 }}>Cancel</button>
          <button onClick={handleSubmit} disabled={!ok} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "none", background: ok ? t.accent : t.textFaint, color: "#fff", fontWeight: 600, cursor: ok ? "pointer" : "default", fontSize: 14 }}>{isEditing ? "Save" : "Add Trip"}</button>
        </div>
      </div>
    </div>
  );
}

function HabitForm({ onAdd, onClose, editHabit, onSaveEdit }) {

  const [name, setName] = useState(editHabit ? editHabit.name : "");

  const isEditing = !!editHabit;

    if (isEditing) { onSaveEdit({ ...editHabit, name: name.trim() }); }
    else { onAdd({ id: generateId(), name: name.trim() }); }

function HabitTracker({ habits, log, onToggle }) {
  const t = React.useContext(ThemeCtx);
  const DAYS = 14;
  const days = getRecentDays(DAYS);
  const today = localDateStr(new Date());

  if (habits.length === 0) return null;

  const streaks = habits.map(h => {
    let count = 0;
    const d = new Date(); d.setHours(0, 0, 0, 0);
    while (true) {
      const ds = localDateStr(d);
      if (log[h.id + ":" + ds]) { count++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return count;
  });

  return (
    <div style={{ marginTop: 14, borderTop: "1px solid " + t.borderLight, paddingTop: 12 }}>
      {habits.map((h, hi) => {
        const color = HABIT_COLORS[hi % HABIT_COLORS.length];
        const streak = streaks[hi];
        return (
          <div key={h.id} style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 3 }}>
              <span style={{ width: 6, height: 6, borderRadius: 2, background: color, flexShrink: 0 }} />
              <span style={{ fontSize: 10, fontWeight: 600, color: t.textSec, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{h.name}</span>
              {streak > 0 && <span style={{ fontSize: 9, fontWeight: 700, color, flexShrink: 0 }}>{streak}d</span>}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(" + DAYS + ", 1fr)", gap: 2 }}>
              {days.map(d => {
                const key = h.id + ":" + d;
                const done = !!log[key];
                const isToday = d === today;
                const dt = new Date(d + "T00:00:00");
                const dayNum = dt.getDate();
                const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
                const emptyBg = isWeekend ? t.weekendEmpty : t.weekdayEmpty;
                const doneBg = isWeekend ? color + "99" : color;
                return (
                  <button key={d} onClick={() => onToggle(h.id, d)} title={formatDate(d)} style={{ aspectRatio: "1", borderRadius: 3, border: isToday ? "1.5px solid " + color : "1.5px solid transparent", background: done ? doneBg : emptyBg, cursor: "pointer", padding: 0, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: isToday ? 800 : done ? 600 : 400, color: done ? "#fff" : isWeekend ? t.textFaint : t.textQuad }}>
                    {dayNum}
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function MiniCalendar({ tasks, trips, schedule, currentDate, onDateClick, onDateLongPress, selectedDate }) {
  const t = React.useContext(ThemeCtx);
  const longPressRef = useRef(null);
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tasksByDate = {};
  const deadlineColors = {};
  const tripDates = {};
  const scheduledDates = {};
  tasks.forEach(t => {
    if (t.deadline) {
      if (!deadlineColors[t.deadline]) {
        const cat = CATEGORIES.find(c => c.id === t.category);
        deadlineColors[t.deadline] = cat ? cat.color : "#999";
      }
    }
    [t.deadline, t.interviewDate, t.notificationDate, t.conferenceDate].filter(Boolean).forEach(d => { if (!tasksByDate[d]) tasksByDate[d] = []; tasksByDate[d].push(t); });
  });
  (trips || []).forEach(trip => {
    datesInRange(trip.startDate, trip.endDate).forEach(d => {
      if (!tripDates[d]) tripDates[d] = [];
      tripDates[d].push(trip.title);
    });
  });
  // Build scheduled dots
  Object.entries(schedule || {}).forEach(([d, items]) => {
    if (items.length > 0) {
      const colors = [...new Set(items.map(a => {
        const tk = tasks.find(t => t.id === a.taskId);
        if (!tk) return "#999";
        return (CATEGORIES.find(c => c.id === tk.category) || {}).color || "#999";
      }))];
      scheduledDates[d] = colors;
    }
  });
  const cells = [];
  const firstDay = new Date(year, month, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const STRIPE_BG = `url("data:image/svg+xml,%3Csvg width='8' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-2 2l4-4M0 8l8-8M6 10l4-4' stroke='%23999' stroke-width='1' opacity='0.25'/%3E%3C/svg%3E")`;

  const handlePointerDown = (dateStr) => {
    longPressRef.current = setTimeout(() => { onDateLongPress(dateStr); longPressRef.current = "fired"; }, 500);
  };
  const handlePointerUp = (dateStr) => {
    if (longPressRef.current === "fired") { longPressRef.current = null; return; }
    clearTimeout(longPressRef.current);
    longPressRef.current = null;
    onDateClick(dateStr);
  };
  const handlePointerLeave = () => { if (longPressRef.current && longPressRef.current !== "fired") { clearTimeout(longPressRef.current); longPressRef.current = null; } };

  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 1, fontSize: 10, fontWeight: 700, color: t.textTer, marginBottom: 4, textAlign: "center" }}>
        {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => <div key={d} style={{ padding: 4 }}>{d}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
        {cells.map((day, i) => {
          if (!day) return <div key={"e" + i} />;
          const dateStr = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
          const hasTasks = tasksByDate[dateStr];
          const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
          const isSelected = selectedDate === dateStr;
          const dlColor = deadlineColors[dateStr];
          const isDeadline = !!dlColor;
          const tripNames = tripDates[dateStr];
          const isTrip = !!tripNames;
          const hasScheduled = !!scheduledDates[dateStr];
          const dots = hasTasks ? [...new Set(hasTasks.map(t => (CATEGORIES.find(c => c.id === t.category) || {}).color || "#999"))] : [];
          // Merge scheduled dots
          if (hasScheduled) { scheduledDates[dateStr].forEach(c => { if (!dots.includes(c)) dots.push(c); }); }
          let bg = "transparent";
          if (isSelected) bg = t.accent;
          else if (isDeadline) bg = dlColor + "15";
          else if (isToday) bg = t.todayBg;
          const border = isDeadline && !isSelected ? "2px solid " + dlColor : "2px solid transparent";
          return (
            <button key={day}
              onPointerDown={() => handlePointerDown(dateStr)}
              onPointerUp={() => handlePointerUp(dateStr)}
              onPointerLeave={handlePointerLeave}
              onDoubleClick={(e) => { e.preventDefault(); onDateLongPress(dateStr); }}
              title={tripNames ? tripNames.join(", ") : undefined}
              style={{ padding: "6px 2px 4px", borderRadius: 6, border, background: bg, backgroundImage: isTrip && !isSelected ? STRIPE_BG : "none", color: isSelected ? t.accentText : isToday ? t.text : t.textSec, fontWeight: isToday || isSelected || isDeadline ? 700 : 400, fontSize: 13, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, position: "relative", userSelect: "none", WebkitUserSelect: "none", touchAction: "manipulation" }}>
              {hasScheduled && !isSelected && <span style={{ position: "absolute", top: 1, right: 2, width: 5, height: 5, borderRadius: "50%", background: "#E05A7A" }} />}
              {day}
              {dots.length > 0 && <div style={{ display: "flex", gap: 2, minHeight: 4 }}>{dots.slice(0, 3).map((c, j) => <span key={j} style={{ width: 4, height: 4, borderRadius: "50%", background: isSelected ? t.accentText : c }} />)}</div>}
              {dots.length === 0 && <div style={{ minHeight: 4 }} />}
            </button>
          );
        })}
      </div>
      <div style={{ fontSize: 9, color: t.textQuad, textAlign: "center", marginTop: 6 }}>Tap to filter · Long-press to schedule</div>
    </div>
  );
}

function useIsMobile() {
  const [mobile, setMobile] = useState(() => window.innerWidth < 640);
  useEffect(() => {
    const handler = () => setMobile(window.innerWidth < 640);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return mobile;
}

function WeekStrip({ tasks, trips, schedule, onDateClick, onDateLongPress, selectedDate }) {
  const t = React.useContext(ThemeCtx);
  const longPressRef = useRef(null);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = [];
  const startOfWeek = new Date(today);
  const dow = startOfWeek.getDay();
  startOfWeek.setDate(startOfWeek.getDate() - (dow === 0 ? 6 : dow - 1));
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    days.push(d);
  }
  const tasksByDate = {};
  tasks.forEach(tk => {
    [tk.deadline, tk.interviewDate, tk.notificationDate, tk.conferenceDate].filter(Boolean).forEach(d => {
      if (!tasksByDate[d]) tasksByDate[d] = [];
      tasksByDate[d].push(tk);
    });
  });
  const tripDates = {};
  (trips || []).forEach(trip => {
    datesInRange(trip.startDate, trip.endDate).forEach(d => { tripDates[d] = true; });
  });
  const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const handleDown = (ds) => { longPressRef.current = setTimeout(() => { onDateLongPress(ds); longPressRef.current = "fired"; }, 500); };
  const handleUp = (ds) => { if (longPressRef.current === "fired") { longPressRef.current = null; return; } clearTimeout(longPressRef.current); longPressRef.current = null; onDateClick(ds); };
  const handleLeave = () => { if (longPressRef.current && longPressRef.current !== "fired") { clearTimeout(longPressRef.current); longPressRef.current = null; } };
  return (
    <div style={{ display: "flex", gap: 4, marginBottom: 14 }}>
      {days.map((d, i) => {
        const ds = localDateStr(d);
        const isToday = ds === localDateStr(today);
        const isSelected = selectedDate === ds;
        const hasTasks = tasksByDate[ds];
        const isTrip = tripDates[ds];
        const hasScheduled = schedule && schedule[ds] && schedule[ds].length > 0;
        const dots = hasTasks ? [...new Set(hasTasks.map(tk => (CATEGORIES.find(c => c.id === tk.category) || {}).color || "#999"))] : [];
        if (hasScheduled) { schedule[ds].forEach(a => { const tk = tasks.find(t => t.id === a.taskId); if (tk) { const c = (CATEGORIES.find(ct => ct.id === tk.category) || {}).color || "#999"; if (!dots.includes(c)) dots.push(c); } }); }
        return (
          <button key={i}
            onPointerDown={() => handleDown(ds)} onPointerUp={() => handleUp(ds)} onPointerLeave={handleLeave}
            onDoubleClick={(e) => { e.preventDefault(); onDateLongPress(ds); }}
            style={{
            flex: 1, padding: "6px 2px 4px", borderRadius: 8, border: isSelected ? "2px solid " + t.accent : isToday ? "2px solid " + t.accent + "60" : "2px solid transparent",
            background: isSelected ? t.accent : isTrip ? t.accent + "10" : "transparent",
            color: isSelected ? t.accentText : isToday ? t.text : t.textSec,
            fontWeight: isToday || isSelected ? 700 : 400, fontSize: 12, cursor: "pointer",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 2, position: "relative",
            userSelect: "none", WebkitUserSelect: "none", touchAction: "manipulation"
          }}>
            {hasScheduled && !isSelected && <span style={{ position: "absolute", top: 0, right: 1, width: 5, height: 5, borderRadius: "50%", background: "#E05A7A" }} />}
            <span style={{ fontSize: 9, textTransform: "uppercase", fontWeight: 600, color: isSelected ? t.accentText : t.textTer }}>{dayNames[i]}</span>
            {d.getDate()}
            {dots.length > 0 && <div style={{ display: "flex", gap: 2, minHeight: 4 }}>{dots.slice(0, 3).map((c, j) => <span key={j} style={{ width: 4, height: 4, borderRadius: "50%", background: isSelected ? t.accentText : c }} />)}</div>}
            {dots.length === 0 && <div style={{ minHeight: 4 }} />}

  );

function parseBibTeX(raw) {
  const entries = [];
  const re = /@(\w+)\s*\{([^,]*),([^@]*)\}/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    const type = m[1].toLowerCase();
    const key = m[2].trim();
    const body = m[3];
    const fields = {};
    const fre = /(\w+)\s*=\s*[\{"]([^}"]*?)[\}"]/g;
    let fm;
    while ((fm = fre.exec(body)) !== null) {
      fields[fm[1].toLowerCase()] = fm[2].replace(/[\{\}]/g, "").trim();
    }
    entries.push({
      id: generateId(),
      citeKey: key,
      type,
      title: fields.title || key,
      author: fields.author || "",
      year: fields.year || "",
      journal: fields.journal || fields.booktitle || "",
      read: false,
      tags: [],
      noteLink: "",
      notes: "",
      addedAt: localDateStr(new Date()),
    });
  }
  return entries;
}

function ReadingList({ readings, onSave, tags, onSaveTags }) {

    if (!newTagLabel.trim()) return;

          {readings.length === 0 ? 'No readings yet — import BibTeX to start.' : 'No matches.'}

                  {r.author && <span>{r.author}</span>}

                </div>
                <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>

                  <input value={editData.type} onChange={e => setEditData({ ...editData, type: e.target.value })} placeholder="Journal Article" style={{ flex: 1, padding: "5px 8px", borderRadius: 5, border: "1px solid " + t.borderLight, fontSize: 11, background: t.bgInput, color: t.text, outline: "none", fontFamily: "inherit" }} />
                </div>
                <div style={{ fontSize: 10, fontWeight: 700, color: t.textTer, textTransform: "uppercase", marginBottom: 4 }}>Tags</div>
                <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>
                  {tags.map(tg => {

                    return <button key={tg.id} onClick={() => toggleEditTag(tg.id)} style={{ padding: "3px 8px", borderRadius: 10, border: "1px solid " + (sel ? tg.color : tg.color + "40"), background: sel ? tg.color : "transparent", color: sel ? "#fff" : tg.color, fontWeight: 600, fontSize: 10, cursor: "pointer" }}>{tg.label}</button>;

                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>

                  <button onClick={() => setEditingId(null)} style={{ padding: "4px 10px", borderRadius: 6, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Cancel</button>

      })}
    </div>
  );
}

function ReadingForm({ onAdd, onClose }) {
  const t = React.useContext(ThemeCtx);
  const [title, setTitle] = useState("");
  const [author, setAuthor] = useState("");
  const [year, setYear] = useState("");
  const [journal, setJournal] = useState("");
  const [type, setType] = useState("Journal Article");
  const [bibInput, setBibInput] = useState("");
  const [mode, setMode] = useState("manual");
  const ok = mode === "manual" ? title.trim() : bibInput.trim();
  const handleSubmit = () => {
    if (mode === "manual") {
      if (!title.trim()) return;
      onAdd([{ id: generateId(), citeKey: "", type, title: title.trim(), author: author.trim(), year: year.trim(), journal: journal.trim(), read: false, tags: [], noteLink: "", notes: "", addedAt: localDateStr(new Date()) }]);
    } else {
      const parsed = parseBibTeX(bibInput);
      if (parsed.length === 0) return;
      onAdd(parsed);
    }
    onClose();
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: t.bgModal, borderRadius: 14, padding: "22px 24px", width: "min(420px,92vw)", boxShadow: "0 20px 60px rgba(0,0,0,0.18)", maxHeight: "85vh", overflowY: "auto" }}>
        <h3 style={{ margin: "0 0 14px", fontSize: 16, fontWeight: 700, color: t.text }}>📚 Add Reading</h3>
        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
          <button onClick={() => setMode("manual")} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid " + (mode === "manual" ? t.accent : t.borderBtn), background: mode === "manual" ? t.accent : t.bgCard, color: mode === "manual" ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Manual</button>
          <button onClick={() => setMode("bibtex")} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid " + (mode === "bibtex" ? t.accent : t.borderBtn), background: mode === "bibtex" ? t.accent : t.bgCard, color: mode === "bibtex" ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Import BibTeX</button>
        </div>
        {mode === "manual" ? (<>
          <label style={labelStyleFn(t)}>Title *</label>
          <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Paper title" style={inputStyleFn(t)} />
          <div style={{ display: "flex", gap: 14 }}>
            <div style={{ flex: 2 }}><label style={labelStyleFn(t)}>Author</label><input value={author} onChange={e => setAuthor(e.target.value)} placeholder="Author(s)" style={inputStyleFn(t)} /></div>
            <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>Year</label><input value={year} onChange={e => setYear(e.target.value)} placeholder="2024" style={inputStyleFn(t)} /></div>
          </div>
          <div style={{ display: "flex", gap: 14 }}>
            <div style={{ flex: 2 }}><label style={labelStyleFn(t)}>Journal / Venue</label><input value={journal} onChange={e => setJournal(e.target.value)} placeholder="Journal name" style={inputStyleFn(t)} /></div>
            <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>Type</label><input value={type} onChange={e => setType(e.target.value)} placeholder="Journal Article" style={inputStyleFn(t)} /></div>
          </div>
        </>) : (<>
          <label style={labelStyleFn(t)}>Paste BibTeX</label>
          <textarea value={bibInput} onChange={e => setBibInput(e.target.value)} placeholder={"@article{key,\n  title={...},\n  author={...},\n  year={2024}\n}"} rows={6} style={{ ...inputStyleFn(t), fontFamily: "monospace", fontSize: 11, resize: "vertical", lineHeight: 1.5 }} />
          <div style={{ fontSize: 10, color: t.textQuad, marginBottom: 8 }}>Supports multiple entries at once</div>
        </>)}
        <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
          <button onClick={handleSubmit} disabled={!ok} style={{ flex: 1, padding: 12, borderRadius: 8, border: "none", background: ok ? t.accent : t.borderBtn, color: ok ? t.accentText : t.textFaint, fontWeight: 700, cursor: ok ? "pointer" : "default", fontSize: 14 }}>{mode === "manual" ? "Add" : "Import"}</button>
          <button onClick={onClose} style={{ padding: "12px 18px", borderRadius: 8, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textTer, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>Cancel</button>

function PlannerView({ tasks, readings, schedule, onOpenAssign, onUnassign, calDate }) {
  const t = React.useContext(ThemeCtx);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayStr = localDateStr(today);
  const [weekOffset, setWeekOffset] = useState(0);
  const [viewMode, setViewMode] = useState("week"); // "week" or "month"
  const [monthDate, setMonthDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));

  // Compute days for week view
  const getWeekDays = (offset) => {
    const ref = new Date(today);
    const dow = ref.getDay();
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    const startMs = ref.getTime() + (mondayOffset + offset * 7) * 864e5;
    const days = [];
    for (let i = 0; i < 7; i++) {
      days.push(new Date(startMs + i * 864e5));
    }
    return days;
  };

  // Compute days for month view
  const getMonthDays = () => {
    const y = monthDate.getFullYear();
    const m = monthDate.getMonth();
    const last = new Date(y, m + 1, 0);
    const days = [];
    for (let d = 1; d <= last.getDate(); d++) {
      days.push(new Date(y, m, d));
    }
    return days;
  };

  const changeMonth = (delta) => {
    setMonthDate(prev => {
      const nd = new Date(prev);
      nd.setMonth(nd.getMonth() + delta);
      return nd;
    });
  };

  const days = viewMode === "week" ? getWeekDays(weekOffset) : getMonthDays();
  const dayLabels = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  const isCurrentMonth = monthDate.getFullYear() === today.getFullYear() && monthDate.getMonth() === today.getMonth();

  // Header label
  const headerLabel = viewMode === "week" ? (() => {
    const s = days[0]; const e = days[6];
    const fmt = (d) => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    return fmt(s) + " – " + fmt(e) + (s.getFullYear() !== today.getFullYear() ? " " + s.getFullYear() : "");
  })() : monthDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

  const renderDayCard = (d) => {
    const ds = localDateStr(d);
    const isToday = ds === todayStr;
    const isPast = d < today;
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const items = schedule[ds] || [];
    const dayName = dayLabels[d.getDay()];

    return (
      <div key={ds} style={{ background: isToday ? t.todayBg : isWeekend ? t.weekendEmpty + "40" : t.bgEmpty, borderRadius: 10, border: isToday ? "2px solid " + t.accent : "1px solid " + t.borderLight, padding: "10px 12px", opacity: isPast && !isToday ? 0.5 : 1, minHeight: viewMode === "month" ? 50 : 80 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: items.length > 0 ? 8 : 0 }}>
          <div>
            <span style={{ fontSize: 11, fontWeight: 700, color: isToday ? t.accent : t.textTer, textTransform: "uppercase", letterSpacing: "0.04em" }}>{dayName} </span>
            <span style={{ fontSize: 13, fontWeight: isToday ? 800 : 600, color: isToday ? t.accent : t.text }}>{d.getDate()}</span>
            {viewMode === "month" && <span style={{ fontSize: 11, color: t.textQuad, marginLeft: 4 }}>{d.toLocaleDateString("en-GB", { month: "short" })}</span>}
          </div>
          <button onClick={() => onOpenAssign(ds)} style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 5, padding: "2px 6px", fontSize: 11, color: t.textTer, cursor: "pointer", fontWeight: 600 }}>+</button>
        </div>
        {items.length === 0 && viewMode === "week" && (
          <div style={{ fontSize: 11, color: t.textFaint, fontStyle: "italic", padding: "8px 0" }}>Nothing scheduled</div>
        )}
        {items.map((item, j) => {
          const tk = tasks.find(tt => tt.id === item.taskId);
          const rd = !tk && (readings || []).find(r => r.id === item.taskId);
          if (!tk && !rd) return null;
          const cat = tk ? CATEGORIES.find(c => c.id === tk.category) : null;
          const color = cat ? cat.color : "#10B981";
          const secName = tk && item.sectionId && tk.paperSections
            ? (tk.paperSections.find(s => s.id === item.sectionId) || {}).name
            : null;
          const title = tk ? tk.title : rd.title;
          return (
            <div key={j} style={{ display: "flex", alignItems: "flex-start", gap: 6, padding: "5px 6px", marginBottom: 4, borderRadius: 6, background: color + "10", borderLeft: "3px solid " + color }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                {secName ? (
                  <>
                    <div style={{ fontSize: 10, color: t.textQuad, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</div>
                    <div style={{ fontSize: 12, color: t.text, fontWeight: 600 }}>{secName}</div>
                  </>
                ) : (
                  <div style={{ fontSize: 12, color: t.text, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</div>
                )}
              </div>
              <button onClick={() => onUnassign(ds, item.taskId, item.sectionId)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 11, padding: 0, flexShrink: 0, lineHeight: 1 }}>✕</button>
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div style={{ background: t.bgCard, borderRadius: 12, padding: 18, border: "1px solid " + t.border, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
      {/* Header with nav and view toggle */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => {
            if (viewMode === "week") setWeekOffset(o => o - 1);
            else changeMonth(-1);
          }} style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 14, color: t.textSec }}>◂</button>
          <h3 style={{ fontSize: 15, fontWeight: 700, color: t.text, margin: 0, minWidth: 140, textAlign: "center" }}>
            {headerLabel}
          </h3>
          <button onClick={() => {
            if (viewMode === "week") setWeekOffset(o => o + 1);
            else changeMonth(1);
          }} style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 14, color: t.textSec, position: "relative" }}>▸{((viewMode === "week" && weekOffset !== 0) || (viewMode === "month" && !isCurrentMonth)) && (
              <span onClick={(e) => { e.stopPropagation(); if (viewMode === "week") setWeekOffset(0); else setMonthDate(new Date(today.getFullYear(), today.getMonth(), 1)); }} style={{ position: "absolute", top: -3, right: -3, width: 7, height: 7, borderRadius: "50%", background: "#E05A7A", cursor: "pointer" }} />
          )}</button>
        </div>
        <div style={{ display: "flex", gap: 2, background: t.bgEmpty, borderRadius: 8, padding: 2 }}>
          {["week", "month"].map(mode => (
            <button key={mode} onClick={() => setViewMode(mode)} style={{
              padding: "5px 12px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600,
              background: viewMode === mode ? t.accent : "transparent",
              color: viewMode === mode ? t.accentText : t.textTer,
            }}>{mode === "week" ? "Week" : "Month"}</button>
          ))}
        </div>
      </div>
      {viewMode === "week" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {days.map(d => renderDayCard(d))}
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {days.map(d => renderDayCard(d))}
        </div>
      )}
    </div>
  );
}

function AssignPanel({ date, tasks, readings, schedule, onAssign, onUnassign, onClose }) {
  const t = React.useContext(ThemeCtx);
  const [filterCat, setFilterCat] = useState("all");
  const closedStatuses = new Set(["noreply", "success", "reviewed", "notapplied", "nointerview", "accepted", "rejected"]);
  const activeTasks = tasks.filter(tk => !closedStatuses.has(tk.status));
  const assigned = schedule[date] || [];
  const isAssigned = (taskId, secId) => assigned.some(a => a.taskId === taskId && (a.sectionId || null) === (secId || null));

  // Build grouped items
  const groups = {};
  CATEGORIES.forEach(cat => { groups[cat.id] = { cat, items: [] }; });
  groups["reading"] = { cat: { id: "reading", label: "📚 Reading", color: "#10B981" }, items: [] };

  activeTasks.forEach(tk => {
    const catId = tk.category;
    if (!groups[catId]) return;
    groups[catId].items.push({ taskId: tk.id, sectionId: null, label: tk.title, color: groups[catId].cat.color, deadline: tk.deadline, deadlineTime: tk.deadlineTime });
    if (tk.category === "paper" && tk.paperSections) {
      tk.paperSections.forEach(sec => {
        groups[catId].items.push({ taskId: tk.id, sectionId: sec.id, label: sec.name, color: groups[catId].cat.color, parentTitle: tk.title });
      });
    }
  });
  (readings || []).filter(r => !r.read).forEach(r => {

    const match = text.match(/setResponse\(([\s\S]+)\);?\s*$/);
    if (!match) return null;
    const json = JSON.parse(match[1]);
    if (json.status !== "ok") return null;
    const cols = json.table.cols;
    let rows = json.table.rows;

    // If headers weren't auto-detected (labels are empty), use first row as headers
    const hasLabels = cols.some(c => c.label && c.label.length > 0);
    let headers;
    if (hasLabels) {
      headers = cols.map(c => c.label);
    } else {
      // First row contains the header names
      if (rows.length === 0) return [];
      headers = rows[0].c.map(cell => (cell && cell.v != null) ? String(cell.v) : "");
      rows = rows.slice(1); // skip header row
    }

    return rows.map(r => {
      const obj = {};
      headers.forEach((hdr, i) => {
        const col = cols[i] || {};
        const cell = r.c && r.c[i];
        if (!cell || cell.v == null) { obj[hdr] = ""; return; }
        const v = cell.v;
        const f = cell.f;
        if (col.type === "date") {

    const task = tasks.find(t => t.id === id);
