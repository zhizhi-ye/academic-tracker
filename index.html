<!-- window.storage polyfill using localStorage -->
<script>
if (!window.storage) {
  window.storage = {
    async get(key) {
      const val = localStorage.getItem("at:" + key);
      if (val === null) return null;
      return { key: key, value: val };
    },
    async set(key, value) {
      localStorage.setItem("at:" + key, value);
      return { key: key, value: value };
    },
    async delete(key) {
      localStorage.removeItem("at:" + key);
      return { key: key, deleted: true };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith("at:")) {
          const realKey = k.slice(3);
          if (!prefix || realKey.startsWith(prefix)) keys.push(realKey);
        }
      }
      return { keys: keys };
    }
  };
}
</script>

<!-- Service Worker registration -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}
</script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef } = React;


const LIGHT = {
  bg: "#ffffff", bgPage: "#f9fafb", bgCard: "#fff", bgCardClosed: "#fafafa",
  bgInput: "#fff", bgModal: "#fff", bgSidebar: "#fff", bgEmpty: "#fafafa",
  border: "#eee", borderLight: "#f0f0f0", borderInput: "#ddd", borderBtn: "#e0e0e0",
  text: "#1a1a2e", textSec: "#555", textTer: "#888", textQuad: "#aaa", textFaint: "#ccc",
  accent: "#1a1a2e", accentText: "#fff",
  todayBg: "#f0f4ff",
  weekdayEmpty: "#e8e8e8", weekendEmpty: "#f5f5f5",
  undoBg: "#FFF8E1", undoBorder: "#FFE082", undoText: "#6D4C00",
};
const DARK = {
  bg: "#1a1a2e", bgPage: "#12121f", bgCard: "#222238", bgCardClosed: "#1e1e30",
  bgInput: "#2a2a42", bgModal: "#222238", bgSidebar: "#1e1e32", bgEmpty: "#1e1e30",
  border: "#333350", borderLight: "#2a2a42", borderInput: "#444460", borderBtn: "#444460",
  text: "#e8e8f0", textSec: "#b0b0c0", textTer: "#888898", textQuad: "#666680", textFaint: "#444460",
  accent: "#5B7FD1", accentText: "#fff",
  todayBg: "#2a2a50",
  weekdayEmpty: "#2a2a42", weekendEmpty: "#222238",
  undoBg: "#3a3520", undoBorder: "#5a5030", undoText: "#d4c080",
};

function useTheme() {
  const [dark, setDark] = useState(() => window.matchMedia?.("(prefers-color-scheme: dark)").matches || false);
  useEffect(() => {
    const mq = window.matchMedia?.("(prefers-color-scheme: dark)");
    if (!mq) return;
    const handler = (e) => setDark(e.matches);
    mq.addEventListener("change", handler);
    return () => mq.removeEventListener("change", handler);
  }, []);
  return dark ? DARK : LIGHT;
}

const ThemeCtx = React.createContext(LIGHT);

const CATEGORIES = [
  { id: "job", label: "Job Application", color: "#5B7FD1" },
  { id: "cfp", label: "Call For Paper", color: "#D4883A" },
  { id: "review", label: "Paper Review", color: "#8B5CF6" },
];

const STATUS = {
  pending: { label: "Pending", bg: "#f0f0f0", fg: "#555" },
  applied: { label: "Applied", bg: "#D1E3FF", fg: "#2A5DB0" },
  interview: { label: "Interview", bg: "#FFF0D1", fg: "#9A6D1F" },
  notification: { label: "Awaiting Result", bg: "#FFF0D1", fg: "#9A6D1F" },
  reviewed: { label: "Reviewed", bg: "#EDE9FE", fg: "#6D28D9" },
  nointerview: { label: "No Interview", bg: "#F0E0E0", fg: "#8B4040" },
  noreply: { label: "No Reply", bg: "#FFE0E0", fg: "#B04040" },
  notapplied: { label: "Not Applied", bg: "#f0f0f0", fg: "#999" },
  success: { label: "Got It!", bg: "#D1F0D9", fg: "#2A7A3A" },
};

const DRIVE_SHEET_ID = "1RhfpEMesNwZfImPumjL8cKiZ7EKAcddZgtqzk_ErHzE";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + DRIVE_SHEET_ID + "/edit";

const STORAGE_KEY = "academic-tracker-tasks-v2";
const TRIPS_KEY = "academic-tracker-trips-v1";
const HABITS_KEY = "academic-tracker-habits-v1";
const HABIT_LOG_KEY = "academic-tracker-habit-log-v1";
const HABIT_COLORS = ["#5B7FD1", "#D4883A", "#8B5CF6", "#E05A7A", "#10B981", "#6366F1"];

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatDate(s) { if (!s) return "\u2014"; const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
function daysBetween(s) { if (!s) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.ceil((new Date(s + "T00:00:00") - t) / 864e5); }

function localDateStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function getRecentDays(n) {
  const days = [];
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) {
    const dt = new Date(d); dt.setDate(d.getDate() - i);
    days.push(localDateStr(dt));
  }
  return days;
}

function datesInRange(start, end) {
  const dates = [];
  const s = new Date(start + "T00:00:00");
  const e = new Date(end + "T00:00:00");
  while (s <= e) {
    const y = s.getFullYear();
    const m = String(s.getMonth() + 1).padStart(2, "0");
    const d = String(s.getDate()).padStart(2, "0");
    dates.push(y + "-" + m + "-" + d);
    s.setDate(s.getDate() + 1);
  }
  return dates;
}

/* ── Styles (now theme-aware via functions) ── */
const labelStyleFn = (t) => ({ display: "block", fontSize: 12, fontWeight: 600, color: t.textSec, marginBottom: 4 });
const inputStyleFn = (t) => ({ width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid " + t.borderInput, fontSize: 14, marginBottom: 14, fontFamily: "inherit", boxSizing: "border-box", outline: "none", background: t.bgInput, color: t.text });
const navBtnStyleFn = (t) => ({ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 14, color: t.textSec });
/* keep old names as defaults for components that don't have theme yet */
const labelStyle = labelStyleFn(LIGHT);
const inputStyle = inputStyleFn(LIGHT);
const navBtnStyle = navBtnStyleFn(LIGHT);

function DeadlineBadge({ dateStr, label, submitted, time }) {
  const days = daysBetween(dateStr);
  if (days === null) return null;
  if (submitted && label === "Deadline") return <span style={{ fontSize: 11, color: "#2A5DB0", fontWeight: 600 }}>Submitted {formatDate(dateStr)}</span>;
  let color = "#888";
  if (days < 0) { color = "#B04040"; }
  else if (days <= 3) { color = "#D4883A"; }
  else if (days <= 7) { color = "#5B7FD1"; }
  else { color = "#6BAB73"; }
  return <span style={{ fontSize: 11, color, fontWeight: 600 }}>{label}: {formatDate(dateStr)}{time ? " · " + time : ""}</span>;
}

function StatusBtn({ label, color, onClick }) {
  return <button onClick={onClick} style={{ flex: 1, padding: "7px 4px", borderRadius: 7, border: "1.5px solid " + color + "30", background: color + "0C", color, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>{label}</button>;
}

function TaskForm({ onAdd, onClose, editTask, onSaveEdit }) {
  const t = React.useContext(ThemeCtx);
  const [title, setTitle] = useState(editTask ? editTask.title : "");
  const [url, setUrl] = useState(editTask ? editTask.url : "");
  const [category, setCategory] = useState(editTask ? editTask.category : "job");
  const [deadline, setDeadline] = useState(editTask ? editTask.deadline : "");
  const [deadlineTime, setDeadlineTime] = useState(editTask ? editTask.deadlineTime || "" : "");
  const [secondDate, setSecondDate] = useState(editTask ? (editTask.category === "job" ? editTask.interviewDate : editTask.notificationDate) || "" : "");
  const [confDate, setConfDate] = useState(editTask ? editTask.conferenceDate || "" : "");
  const [notes, setNotes] = useState(editTask ? editTask.notes : "");
  const [status, setStatus] = useState(editTask ? editTask.status : "pending");
  const ok = title.trim() && deadline;
  const isJob = category === "job";
  const isReview = category === "review";
  const isEditing = !!editTask;
  const handleSubmit = () => {
    if (!ok) return;
    const base = { title: title.trim(), url: url.trim(), category, deadline, deadlineTime: deadlineTime.trim(), interviewDate: isJob ? secondDate : "", notificationDate: category === "cfp" ? secondDate : "", conferenceDate: category === "cfp" ? confDate : "", notes: notes.trim() };
    if (isEditing) {
      onSaveEdit({ ...editTask, ...base, status });
    } else {
      onAdd({ id: generateId(), ...base, status: "pending", createdAt: new Date().toISOString().slice(0, 10) });
    }
    onClose();
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: t.bgModal, borderRadius: 14, padding: "28px 30px", width: "min(460px,92vw)", boxShadow: "0 20px 60px rgba(0,0,0,0.18)", maxHeight: "90vh", overflowY: "auto" }}>
        <h3 style={{ margin: "0 0 20px", fontSize: 18, fontWeight: 700, color: t.text }}>{isEditing ? "Edit Task" : "Add New Task"}</h3>
        <label style={labelStyleFn(t)}>Title *</label>
        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Museum Educator / ICML 2027" style={inputStyleFn(t)} />
        <label style={labelStyleFn(t)}>Link (URL)</label>
        <input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://..." style={inputStyleFn(t)} />
        <label style={labelStyleFn(t)}>Category</label>
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          {CATEGORIES.map(c => <button key={c.id} onClick={() => setCategory(c.id)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, border: "2px solid", borderColor: category === c.id ? c.color : "#e0e0e0", background: category === c.id ? c.color + "18" : t.bgEmpty, color: category === c.id ? c.color : "#777", fontWeight: 600, fontSize: 12, cursor: "pointer" }}>{c.label}</button>)}
        </div>
        <div style={{ display: "flex", gap: 14 }}>
          <div style={{ flex: 2 }}><label style={labelStyleFn(t)}>{isReview ? "Review Deadline *" : "Submission Deadline *"}</label><input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} style={inputStyleFn(t)} /></div>
          <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>Time</label><input value={deadlineTime} onChange={e => setDeadlineTime(e.target.value)} placeholder="e.g. 17:00" style={inputStyleFn(t)} /></div>
        </div>
        {!isReview && (
          <div style={{ display: "flex", gap: 14 }}>
            <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>{isJob ? "Interview Date" : "Notification Date"}</label><input type="date" value={secondDate} onChange={e => setSecondDate(e.target.value)} style={inputStyleFn(t)} /></div>
          </div>
        )}
        {category === "cfp" && <div><label style={labelStyleFn(t)}>Conference Date</label><input type="date" value={confDate} onChange={e => setConfDate(e.target.value)} style={inputStyleFn(t)} /></div>}
        <label style={labelStyleFn(t)}>Notes</label>
        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} placeholder="Any extra details..." style={{ ...inputStyleFn(t), resize: "vertical" }} />
        {isEditing && (
          <div>
            <label style={labelStyleFn(t)}>Status</label>
            <select value={status} onChange={e => setStatus(e.target.value)} style={{ ...inputStyleFn(t), cursor: "pointer", appearance: "auto" }}>
              {Object.entries(STATUS).map(([key, val]) => (
                <option key={key} value={key}>{val.label}</option>
              ))}
            </select>
          </div>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1px solid #ddd", background: t.bgEmpty, color: t.textSec, fontWeight: 600, cursor: "pointer", fontSize: 14 }}>Cancel</button>
          <button onClick={handleSubmit} disabled={!ok} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "none", background: ok ? t.accent : t.textFaint, color: "#fff", fontWeight: 600, cursor: ok ? "pointer" : "default", fontSize: 14 }}>{isEditing ? "Save" : "Add Task"}</button>
        </div>
      </div>
    </div>
  );
}

function TaskCard({ task, onStatusChange, onDelete, onEdit }) {
  const [confirming, setConfirming] = useState(false);
  const t = React.useContext(ThemeCtx);
  const cat = CATEGORIES.find(c => c.id === task.category) || CATEGORIES[0];
  const st = STATUS[task.status] || STATUS.pending;
  const closed = task.status === "noreply" || task.status === "success" || task.status === "reviewed" || task.status === "notapplied" || task.status === "nointerview";
  const isJob = task.category === "job";
  const isReview = task.category === "review";
  const submitted = !isReview && task.status !== "pending";
  const secondLabel = isJob ? "Interview" : "Notification";
  const secondVal = isReview ? null : (isJob ? task.interviewDate : task.notificationDate);
  return (
    <div style={{ background: closed ? t.bgCardClosed : t.bgCard, borderRadius: 12, padding: "16px 18px", border: "1px solid " + (closed ? t.borderLight : t.border), opacity: closed ? 0.6 : 1, boxShadow: closed ? "none" : "0 2px 8px rgba(0,0,0,0.04)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", color: cat.color, background: cat.color + "15", padding: "2px 8px", borderRadius: 4 }}>{cat.label}</span>
            <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 4, background: st.bg, color: st.fg }}>{st.label}</span>
          </div>
          <div style={{ fontSize: 15, fontWeight: 600, color: t.text, marginBottom: 4, lineHeight: 1.3 }}>
            {task.url ? <a href={task.url} target="_blank" rel="noopener noreferrer" style={{ color: t.text, textDecoration: "none", borderBottom: "1px dashed " + t.textQuad }}>{task.title} {"\u2197"}</a> : task.title}
          </div>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 6 }}>
            <DeadlineBadge dateStr={task.deadline} label="Deadline" submitted={submitted} time={task.deadlineTime} />
            {secondVal && <DeadlineBadge dateStr={secondVal} label={secondLabel} submitted={false} />}
            {!isReview && task.conferenceDate && <DeadlineBadge dateStr={task.conferenceDate} label="Conference" submitted={false} />}
          </div>
          {task.notes && <div style={{ fontSize: 12, color: t.textTer, marginTop: 6, lineHeight: 1.4 }}>{task.notes}</div>}
        </div>
        <div style={{ display: "flex", gap: 2, flexShrink: 0, alignItems: "center" }}>
          {!confirming ? (
            <>
              <button onClick={() => onEdit(task)} title="Edit" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 13, padding: 4, lineHeight: 1 }}>{"\u270E"}</button>
              <button onClick={() => setConfirming(true)} title="Delete" style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 16, padding: 4, lineHeight: 1 }}>{"\u2715"}</button>
            </>
          ) : (
            <div style={{ display: "flex", gap: 4 }}>
              <button onClick={() => onDelete(task.id)} style={{ padding: "3px 8px", borderRadius: 5, border: "none", background: "#B04040", color: "#fff", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Delete</button>
              <button onClick={() => setConfirming(false)} style={{ padding: "3px 8px", borderRadius: 5, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textTer, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
            </div>
          )}
        </div>
      </div>
      {!closed && (
        <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
          {isReview ? (
            <StatusBtn label="Reviewed" color="#8B5CF6" onClick={() => onStatusChange(task.id, "reviewed")} />
          ) : (
            <>
              {task.status === "pending" && <StatusBtn label="Applied" color="#5B7FD1" onClick={() => onStatusChange(task.id, "applied")} />}
              {task.status === "applied" && <StatusBtn label="Applied ✓" color="#5B7FD1" onClick={() => onStatusChange(task.id, "pending")} />}
              {isJob && (task.status === "pending" || task.status === "applied") && <StatusBtn label="Interview" color="#D4883A" onClick={() => onStatusChange(task.id, "interview")} />}
              {!isJob && (task.status === "pending" || task.status === "applied") && <StatusBtn label="Awaiting Result" color="#D4883A" onClick={() => onStatusChange(task.id, "notification")} />}
              {(task.status === "applied" || task.status === "interview") && <StatusBtn label="No Interview" color="#8B4040" onClick={() => onStatusChange(task.id, "nointerview")} />}
              <StatusBtn label="Got It!" color="#2A7A3A" onClick={() => onStatusChange(task.id, "success")} />
            </>
          )}
        </div>
      )}
      {closed && (
        <div style={{ marginTop: 10 }}>
          <button onClick={() => onStatusChange(task.id, "pending")} style={{ fontSize: 11, color: t.textTer, background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 10px", cursor: "pointer" }}>{"\u21A9"} Reopen</button>
        </div>
      )}
    </div>
  );
}

function TripForm({ onAdd, onClose, editTrip, onSaveEdit }) {
  const t = React.useContext(ThemeCtx);
  const [title, setTitle] = useState(editTrip ? editTrip.title : "");
  const [startDate, setStartDate] = useState(editTrip ? editTrip.startDate : "");
  const [endDate, setEndDate] = useState(editTrip ? editTrip.endDate : "");
  const [notes, setNotes] = useState(editTrip ? editTrip.notes || "" : "");
  const ok = title.trim() && startDate && endDate && startDate <= endDate;
  const isEditing = !!editTrip;
  const handleSubmit = () => {
    if (!ok) return;
    if (isEditing) {
      onSaveEdit({ ...editTrip, title: title.trim(), startDate, endDate, notes: notes.trim() });
    } else {
      onAdd({ id: generateId(), title: title.trim(), startDate, endDate, notes: notes.trim() });
    }
    onClose();
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: t.bgModal, borderRadius: 14, padding: "28px 30px", width: "min(400px,92vw)", boxShadow: "0 20px 60px rgba(0,0,0,0.18)" }}>
        <h3 style={{ margin: "0 0 20px", fontSize: 18, fontWeight: 700, color: t.text }}>{isEditing ? "Edit Trip" : "Add Trip"}</h3>
        <label style={labelStyleFn(t)}>Destination *</label>
        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. York, Edinburgh" style={inputStyleFn(t)} />
        <div style={{ display: "flex", gap: 14 }}>
          <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>From *</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={inputStyleFn(t)} /></div>
          <div style={{ flex: 1 }}><label style={labelStyleFn(t)}>To *</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={inputStyleFn(t)} /></div>
        </div>
        <label style={labelStyleFn(t)}>Notes</label>
        <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Holiday, conference, etc." style={inputStyleFn(t)} />
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1px solid #ddd", background: t.bgEmpty, color: t.textSec, fontWeight: 600, cursor: "pointer", fontSize: 14 }}>Cancel</button>
          <button onClick={handleSubmit} disabled={!ok} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "none", background: ok ? t.accent : t.textFaint, color: "#fff", fontWeight: 600, cursor: ok ? "pointer" : "default", fontSize: 14 }}>{isEditing ? "Save" : "Add Trip"}</button>
        </div>
      </div>
    </div>
  );
}

function HabitForm({ onAdd, onClose, editHabit, onSaveEdit }) {
  const t = React.useContext(ThemeCtx);
  const [name, setName] = useState(editHabit ? editHabit.name : "");
  const ok = name.trim();
  const isEditing = !!editHabit;
  const handleSubmit = () => {
    if (!ok) return;
    if (isEditing) { onSaveEdit({ ...editHabit, name: name.trim() }); }
    else { onAdd({ id: generateId(), name: name.trim() }); }
    onClose();

function HabitTracker({ habits, log, onToggle }) {
  const t = React.useContext(ThemeCtx);
  const DAYS = 14;
  const days = getRecentDays(DAYS);
  const today = localDateStr(new Date());

  if (habits.length === 0) return null;

  const streaks = habits.map(h => {
    let count = 0;
    const d = new Date(); d.setHours(0, 0, 0, 0);
    while (true) {
      const ds = localDateStr(d);
      if (log[h.id + ":" + ds]) { count++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return count;
  });

  return (
    <div style={{ marginTop: 14, borderTop: "1px solid " + t.borderLight, paddingTop: 12 }}>
      {habits.map((h, hi) => {
        const color = HABIT_COLORS[hi % HABIT_COLORS.length];
        const streak = streaks[hi];
        return (
          <div key={h.id} style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 3 }}>
              <span style={{ width: 6, height: 6, borderRadius: 2, background: color, flexShrink: 0 }} />
              <span style={{ fontSize: 10, fontWeight: 600, color: t.textSec, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{h.name}</span>
              {streak > 0 && <span style={{ fontSize: 9, fontWeight: 700, color, flexShrink: 0 }}>{streak}d</span>}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(" + DAYS + ", 1fr)", gap: 2 }}>
              {days.map(d => {
                const key = h.id + ":" + d;
                const done = !!log[key];
                const isToday = d === today;
                const dt = new Date(d + "T00:00:00");
                const dayNum = dt.getDate();
                const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
                const emptyBg = isWeekend ? t.weekendEmpty : t.weekdayEmpty;
                const doneBg = isWeekend ? color + "99" : color;
                return (
                  <button key={d} onClick={() => onToggle(h.id, d)} title={formatDate(d)} style={{ aspectRatio: "1", borderRadius: 3, border: isToday ? "1.5px solid " + color : "1.5px solid transparent", background: done ? doneBg : emptyBg, cursor: "pointer", padding: 0, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: isToday ? 800 : done ? 600 : 400, color: done ? "#fff" : isWeekend ? t.textFaint : t.textQuad }}>
                    {dayNum}
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function MiniCalendar({ tasks, trips, currentDate, onDateClick, selectedDate }) {
  const t = React.useContext(ThemeCtx);
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tasksByDate = {};
  const deadlineColors = {};
  const tripDates = {};
  tasks.forEach(t => {
    if (t.deadline) {
      if (!deadlineColors[t.deadline]) {
        const cat = CATEGORIES.find(c => c.id === t.category);
        deadlineColors[t.deadline] = cat ? cat.color : "#999";
      }
    }
    [t.deadline, t.interviewDate, t.notificationDate, t.conferenceDate].filter(Boolean).forEach(d => { if (!tasksByDate[d]) tasksByDate[d] = []; tasksByDate[d].push(t); });
  });
  (trips || []).forEach(trip => {
    datesInRange(trip.startDate, trip.endDate).forEach(d => {
      if (!tripDates[d]) tripDates[d] = [];
      tripDates[d].push(trip.title);
    });
  });
  const cells = [];
  const firstDay = new Date(year, month, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const STRIPE_BG = `url("data:image/svg+xml,%3Csvg width='8' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-2 2l4-4M0 8l8-8M6 10l4-4' stroke='%23999' stroke-width='1' opacity='0.25'/%3E%3C/svg%3E")`;
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 1, fontSize: 10, fontWeight: 700, color: t.textTer, marginBottom: 4, textAlign: "center" }}>
        {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => <div key={d} style={{ padding: 4 }}>{d}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
        {cells.map((day, i) => {
          if (!day) return <div key={"e" + i} />;
          const dateStr = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
          const hasTasks = tasksByDate[dateStr];
          const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
          const isSelected = selectedDate === dateStr;
          const dlColor = deadlineColors[dateStr];
          const isDeadline = !!dlColor;
          const tripNames = tripDates[dateStr];
          const isTrip = !!tripNames;
          const dots = hasTasks ? [...new Set(hasTasks.map(t => (CATEGORIES.find(c => c.id === t.category) || {}).color || "#999"))] : [];
          let bg = "transparent";
          if (isSelected) bg = t.accent;
          else if (isDeadline) bg = dlColor + "15";
          else if (isToday) bg = t.todayBg;
          const border = isDeadline && !isSelected ? "2px solid " + dlColor : "2px solid transparent";
          return (
            <button key={day} onClick={() => onDateClick(dateStr)} title={tripNames ? tripNames.join(", ") : undefined} style={{ padding: "6px 2px 4px", borderRadius: 6, border, background: bg, backgroundImage: isTrip && !isSelected ? STRIPE_BG : "none", color: isSelected ? t.accentText : isToday ? t.text : t.textSec, fontWeight: isToday || isSelected || isDeadline ? 700 : 400, fontSize: 13, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, position: "relative" }}>
              {day}
              {dots.length > 0 && <div style={{ display: "flex", gap: 2, minHeight: 4 }}>{dots.slice(0, 3).map((c, j) => <span key={j} style={{ width: 4, height: 4, borderRadius: "50%", background: isSelected ? t.accentText : c }} />)}</div>}
              {dots.length === 0 && <div style={{ minHeight: 4 }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function MonthlyRoutine({ habits, log, onToggle, calDate, onEditHabit, onDeleteHabit }) {

                return (

          </div>
        );
      })}

  );
}

      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, justifyContent: "space-between" }}>
          <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px", letterSpacing: "-0.02em" }}>Academic Tracker</h1>
          <a href={SHEET_URL} target="_blank" rel="noopener noreferrer" title="Open Google Sheet" style={{ background: "none", border: "1px solid " + t.borderBtn, borderRadius: 6, padding: "4px 8px", fontSize: 12, color: "#2A7A3A", fontWeight: 600, textDecoration: "none", display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ fontSize: 14 }}>📊</span> Sheet
          </a>
        </div>
        <p style={{ margin: 0, fontSize: 13, color: t.textTer }}>
          {activeTasks.length} active task{activeTasks.length !== 1 ? "s" : ""}
          {urgentCount > 0 && <span style={{ color: "#D4883A", fontWeight: 600 }}>{" \u00B7 "}{urgentCount} due soon</span>}
        </p>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => { setEditTask(null); setShowForm(true); }} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: t.accent, color: t.accentText, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>+ Add Task</button>
        <button onClick={() => { setEditTrip(null); setShowTripForm(true); }} style={{ padding: "9px 14px", borderRadius: 8, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textSec, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>+ Trip</button>
        <button onClick={() => { setEditHabit(null); setShowHabitForm(true); }} style={{ padding: "9px 14px", borderRadius: 8, border: "1px solid " + t.borderBtn, background: t.bgCard, color: t.textSec, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>+ Routine</button>
        <div style={{ flex: 1 }} />
        {["active", "closed", "all"].map(s => <button key={s} onClick={() => setFilterStatus(s)} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid", borderColor: filterStatus === s ? t.accent : t.borderBtn, background: filterStatus === s ? t.accent : t.bgCard, color: filterStatus === s ? t.accentText : t.textTer, fontWeight: 600, fontSize: 12, cursor: "pointer", textTransform: "capitalize" }}>{s}</button>)}
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap" }}>
        <button onClick={() => { setFilterCat("all"); setShowRoutine(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: filterCat === "all" && !showRoutine ? t.textSec : t.borderBtn, background: filterCat === "all" && !showRoutine ? t.textSec : t.bgCard, color: filterCat === "all" && !showRoutine ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>All</button>
        {CATEGORIES.map(c => <button key={c.id} onClick={() => { setFilterCat(c.id); setShowRoutine(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: filterCat === c.id && !showRoutine ? c.color : t.borderBtn, background: filterCat === c.id && !showRoutine ? c.color + "18" : t.bgCard, color: filterCat === c.id && !showRoutine ? c.color : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>{c.label}</button>)}
        <button onClick={() => setShowRoutine(!showRoutine)} style={{ padding: "5px 12px", borderRadius: 6, border: "1px solid", borderColor: showRoutine ? t.accent : t.borderBtn, background: showRoutine ? t.accent : t.bgCard, color: showRoutine ? t.accentText : t.textTer, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Daily Routine</button>
      </div>
      <div style={{ display: "flex", gap: 24, alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style={{ width: 260, flexShrink: 0, background: t.bgSidebar, borderRadius: 12, padding: 16, border: "1px solid " + t.border, boxShadow: "0 2px 8px rgba(0,0,0,0.03)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <button onClick={() => changeMonth(-1)} style={navBtnStyleFn(t)}>{"\u25C2"}</button>
            <span style={{ fontSize: 14, fontWeight: 700 }}>{calDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</span>
            <button onClick={() => changeMonth(1)} style={navBtnStyleFn(t)}>{"\u25B8"}</button>
          </div>
          <MiniCalendar tasks={tasks} trips={trips} currentDate={calDate} selectedDate={selectedDate} onDateClick={d => setSelectedDate(selectedDate === d ? null : d)} />
          {selectedDate && <div style={{ fontSize: 12, color: "#5B7FD1", fontWeight: 600, textAlign: "center" }}>Showing: {formatDate(selectedDate)} <button onClick={() => setSelectedDate(null)} style={{ marginLeft: 8, background: "none", border: "none", color: t.textTer, cursor: "pointer", fontSize: 12 }}>{"\u2715"} clear</button></div>}
          <HabitTracker habits={habits} log={habitLog} onToggle={toggleHabit} />
          <div style={{ marginTop: 14, borderTop: "1px solid " + t.borderLight, paddingTop: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: t.textTer, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>Summary</div>
            {CATEGORIES.map(c => { const count = tasks.filter(tt => tt.category === c.id && tt.status !== "noreply" && tt.status !== "success" && tt.status !== "reviewed").length; return <div key={c.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}><span style={{ color: t.textSec }}>{c.label}</span><span style={{ fontWeight: 700, color: c.color }}>{count}</span></div>; })}
          </div>
          {trips.length > 0 && (
            <div style={{ marginTop: 14, borderTop: "1px solid " + t.borderLight, paddingTop: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: t.textTer, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Trips</div>
              {[...trips].sort((a, b) => a.startDate.localeCompare(b.startDate)).map(trip => (
                <div key={trip.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, marginBottom: 6, gap: 4 }}>
                  <div style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    <span style={{ fontWeight: 600, color: t.textSec }}>{trip.title}</span>
                    <span style={{ color: t.textQuad }}> · {formatDate(trip.startDate)}–{formatDate(trip.endDate)}</span>
                  </div>
                  <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
                    <button onClick={() => handleEditTrip(trip)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 11, padding: 2 }}>{"\u270E"}</button>
                    <button onClick={() => deleteTrip(trip.id)} style={{ background: "none", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 13, padding: 2 }}>{"\u2715"}</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1, minWidth: 300 }}>
          {recentlyDeleted.map(d => (
            <div key={d.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 14px", marginBottom: 10, borderRadius: 10, background: t.undoBg, border: "1px solid " + t.undoBorder }}>
              <span style={{ fontSize: 13, color: t.undoText, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                Deleted <strong>{d.title}</strong>
              </span>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                <button onClick={() => undoDelete(d.id)} style={{ padding: "4px 12px", borderRadius: 6, border: "none", background: t.accent, color: t.accentText, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Undo</button>
                <button onClick={() => dismissUndo(d.id)} style={{ padding: "4px 8px", borderRadius: 6, border: "none", background: "transparent", color: t.textTer, fontSize: 14, cursor: "pointer", lineHeight: 1 }}>{"\u2715"}</button>
              </div>
            </div>
          ))}
          {showRoutine ? (
            <MonthlyRoutine habits={habits} log={habitLog} onToggle={toggleHabit} calDate={calDate} onEditHabit={handleEditHabit} onDeleteHabit={deleteHabit} />
          ) : sorted.length === 0 ? (
            <div style={{ textAlign: "center", padding: "50px 20px", color: t.textFaint, fontSize: 14, background: t.bgEmpty, borderRadius: 12, border: "1px dashed " + t.borderBtn }}>
              {tasks.length === 0 ? 'No tasks yet \u2014 tap "+ Add Task" to get started.' : "No tasks match the current filters."}
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sorted.map(task => <TaskCard key={task.id} task={task} onStatusChange={changeStatus} onDelete={deleteTask} onEdit={handleEdit} />)}
            </div>
          )}
        </div>
      </div>
      {showForm && <TaskForm onAdd={addTask} onClose={() => { setShowForm(false); setEditTask(null); }} editTask={editTask} onSaveEdit={saveEdit} />}
      {showTripForm && <TripForm onAdd={addTrip} onClose={() => { setShowTripForm(false); setEditTrip(null); }} editTrip={editTrip} onSaveEdit={saveEditTrip} />}
      {showHabitForm && <HabitForm onAdd={addHabit} onClose={() => { setShowHabitForm(false); setEditHabit(null); }} editHabit={editHabit} onSaveEdit={saveEditHabit} />}
    </div>
    </ThemeCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AcademicTracker));
</script>
</body>
</html>
